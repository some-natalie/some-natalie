name: 🦙 Publish Ollama Model to GHCR

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Model to publish (e.g., llama3.2:latest)'
        required: true
        type: string
      artifact_name:
        description: 'Artifact name in GHCR'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sudo bash

      - name: Install ollama-dl
        run: pip3 install ollama-dl

      - name: Start Ollama
        run: |
          ollama serve &
          for i in {1..100}; do
            if curl -sf http://localhost:11434/api/version > /dev/null 2>&1; then
              echo "Ollama is ready!"
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Pull model with ollama-dl
        run: |
          MODEL="${{ github.event.inputs.model_name }}"
          ollama-dl "$MODEL" --output-dir /tmp/models || ollama pull "$MODEL" || true

      - name: Register model
        run: |
          MODEL="${{ github.event.inputs.model_name }}"
          mkdir -p /root/.ollama/models/blobs
          mkdir -p /root/.ollama/models/manifests
          if ls /tmp/models/*.gguf 1>/dev/null 2>&1; then
            cp /tmp/models/*.gguf /root/.ollama/models/blobs/ 2>/dev/null || true
          fi
          ollama list || true

      - name: Prepare artifact
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifact"
          echo "ARTIFACT=${GITHUB_WORKSPACE}/artifact" >> $GITHUB_ENV

      - name: Export model files
        run: |
          OLLAMA_MODELS="/root/.ollama/models"
          ARTIFACT="${GITHUB_WORKSPACE}/artifact"
          if [ -d "$OLLAMA_MODELS/blobs" ]; then
            cp -r "$OLLAMA_MODELS/blobs" "$ARTIFACT/" || true
          fi
          if [ -d "$OLLAMA_MODELS/manifests" ]; then
            cp -r "$OLLAMA_MODELS/manifests" "$ARTIFACT/" || true
          fi
          echo "model=${{ github.event.inputs.model_name }}" > "$ARTIFACT/info.txt"

      - name: Verify pull
        run: |
          echo "Models:"
          ollama list || true
          ollama show "${{ github.event.inputs.model_name }}" || true

      - name: Add disconnected script
        run: |
          cp "${GITHUB_WORKSPACE}/scripts/disconnected-setup.sh" "${GITHUB_WORKSPACE}/artifact/disconnected-setup.sh"
          chmod +x "${GITHUB_WORKSPACE}/artifact/disconnected-setup.sh"

      - name: Install ORAS
        uses: oras-project/setup-oras@v2

      - name: Push to GHCR
        run: |
          ARTIFACT="${GITHUB_WORKSPACE}/artifact"
          OCI_NAME="${{ github.event.inputs.artifact_name }}"
          OCI_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${OCI_NAME}:latest"
          
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          
          find "${ARTIFACT}" -type f | while read f; do
            REL="${f#${ARTIFACT}/}"
            oras push "${OCI_REF}" "${REL}=${f}" \
              --annotation "model.source=ollama" \
              --annotation "model.name=${{ github.event.inputs.model_name }}" || true
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-${{ github.event.inputs.artifact_name }}
          path: ${{ env.ARTIFACT }}
          retention-days: 30

      - name: Summary
        run: |
          OCI_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ github.event.inputs.artifact_name }}:latest"
          echo "## Published" >> $GITHUB_STEP_SUMMARY
          echo "Model: \`${{ github.event.inputs.model_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "OCI: \`${OCI_REF}\`" >> $GITHUB_STEP_SUMMARY