name: 🦙 Publish Ollama Model to GHCR

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Model to publish (e.g., llama3.2:latest)'
        required: true
        type: string
      artifact_name:
        description: 'Artifact name in GHCR'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Ollama
        run: |
          echo "Installing Ollama..."
          ARCH=$(uname -m)
          case "$ARCH" in x86_64) ARCH=amd64 ;; esac
          curl -fsSL https://ollama.com/download/ollama-linux-$ARCH.tar.gz -o /tmp/ollama.tar.gz
          sudo tar -C /usr -xzf /tmp/ollama.tar.gz
          rm /tmp/ollama.tar.gz
          echo "Ollama installed successfully"

      - name: Start Ollama
        run: |
          echo "Starting Ollama..."
          ollama serve &
          
          # Wait for Ollama to be ready
          echo "Waiting for Ollama API to be ready..."
          for i in {1..100}; do
            if curl -sf http://localhost:11434/api/version > /dev/null 2>&1; then
              echo "Ollama API is ready"
              curl -s http://localhost:11434/api/version
              exit 0
            fi
            echo "Waiting... ($i/100)"
            sleep 3
          done
          
          echo "ERROR: Ollama failed to start"
          exit 1

      - name: Pull model
        run: |
          MODEL="${{ github.event.inputs.model_name }}"
          echo "Pulling model: $MODEL"
          
          # Show current models
          echo "Current models:"
          ollama list || true
          
          # Always pull the GGUF file - this is the actual model
          echo "Pulling model file..."
          timeout 300 ollama pull "$MODEL" || {
            echo "WARNING: Pull may need retry or model may not exist"
          }
          
          # Verify the pull
          echo ""
          echo "After pull - models:"
          ollama list
          
          # Check if model exists
          if ! ollama list | grep -q "$MODEL"; then
            echo "Model not found in list, trying ollama show"
            ollama show "$MODEL" 2>&1 || echo "Model inspection failed"
          fi
          
          echo "Model pull step completed"

      - name: Prepare artifact
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifact"
          echo "ARTIFACT=${GITHUB_WORKSPACE}/artifact" >> $GITHUB_ENV

      - name: Verify and export model files
        run: |
          set -euo pipefail
          OLLAMA_MODELS="/root/.ollama/models"
          ARTIFACT="${GITHUB_WORKSPACE}/artifact"
          MODEL="${{ github.event.inputs.model_name }}"
          
          echo "=== Verifying Ollama store ==="
          echo "Ollama models directory: $OLLAMA_MODELS"
          ls -la "$OLLAMA_MODELS/" || echo "Directory not accessible"
          
          # List blobs directory
          echo ""
          echo "=== Blobs in store ==="
          if [ -d "$OLLAMA_MODELS/blobs" ]; then
            echo "Blobs directory exists"
            ls -la "$OLLAMA_MODELS/blobs/" | head -5 || true
            BLOB_COUNT=$(find "$OLLAMA_MODELS/blobs" -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "Total blobs: $BLOB_COUNT"
          fi
          
          # List manifests directory
          echo ""
          echo "=== Manifests in store ==="
          if [ -d "$OLLAMA_MODELS/manifests" ]; then
            echo "Manifests directory exists"
            find "$OLLAMA_MODELS/manifests" -type f | head -5 || true
          fi
          
          # Copy blobs for artifact
          echo ""
          echo "=== Copying to artifact ==="
          if [ -d "$OLLAMA_MODELS/blobs" ]; then
            mkdir -p "${ARTIFACT}/ollama-blobs"
            cp -r "$OLLAMA_MODELS/blobs"/* "${ARTIFACT}/ollama-blobs/" 2>/dev/null || true
          fi
          
          # Copy manifests for artifact
          if [ -d "$OLLAMA_MODELS/manifests" ]; then
            mkdir -p "${ARTIFACT}/ollama-manifests"
            cp -r "$OLLAMA_MODELS/manifests"/* "${ARTIFACT}/ollama-manifests/" 2>/dev/null || true
          fi
          
          # Add metadata
          cat > "${ARTIFACT}/info.txt" << EOF
          model=${MODEL}
          artifact=${{ github.event.inputs.artifact_name }}
          exported=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF
          
          echo "Artifact contents:"
          ls -la "${ARTIFACT}/" || true

      - name: Add disconnected script
        run: |
          cp "${GITHUB_WORKSPACE}/scripts/disconnected-setup.sh" "${GITHUB_WORKSPACE}/artifact/disconnected-setup.sh"
          chmod +x "${GITHUB_WORKSPACE}/artifact/disconnected-setup.sh"

      - name: Install ORAS
        uses: oras-project/setup-oras@v2
        with:
          oras-version: v1.2.1

      - name: Push to GHCR
        run: |
          ARTIFACT="${GITHUB_WORKSPACE}/artifact"
          OCI_NAME="${{ github.event.inputs.artifact_name }}"
          OCI_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${OCI_NAME}:latest"
          
          echo "Pushing to: $OCI_REF"
          
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login "${{ env.REGISTRY }}" \
            -u "${{ github.actor }}" --password-stdin
          
          echo "Files to push:"
          find "${ARTIFACT}" -type f
          
          for f in $(find "${ARTIFACT}" -type f); do
            REL="${f#${ARTIFACT}/}"
            echo "Pushing: $REL"
            oras push "${OCI_REF}" "${REL}=${f}" \
              --annotation "model.source=ollama" \
              --annotation "model.name=${{ github.event.inputs.model_name }}" || true
          done
          
          echo "Published: $OCI_REF"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-${{ github.event.inputs.artifact_name }}
          path: ${{ env.ARTIFACT }}
          retention-days: 30

      - name: Summary
        run: |
          OCI_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ github.event.inputs.artifact_name }}:latest"
          echo "## Published" >> $GITHUB_STEP_SUMMARY
          echo "- Model: \`${{ github.event.inputs.model_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- OCI: \`${OCI_REF}\`" >> $GITHUB_STEP_SUMMARY