name: 🦙 Publish Ollama Model to GHCR

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Model to publish (e.g., llama3.2:latest)'
        required: true
        type: string
      artifact_name:
        description: 'Artifact name in GHCR (e.g., my-llama-model)'
        required: true
        type: string
      runner:
        description: 'Publishing runner (macos-26 supports MLX; Ubuntu requires a Linux-compatible model)'
        required: true
        type: choice
        default: ubuntu-latest
        options:
          - macos-26
          - ubuntu-latest

permissions: {}

# Serialize writes to the same GHCR tag without cancelling an active upload.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.artifact_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish Ollama model
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    permissions:
      contents: read # Check out the repository's offline setup script.
      packages: write # Publish the model artifact to GHCR.
    defaults:
      run:
        shell: bash
    env:
      MODEL_NAME: ${{ inputs.model_name }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      # Use a separate port and store from any service started by the installer.
      OLLAMA_HOST: 127.0.0.1:11435

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare artifact
        run: |
          if [[ ! "$MODEL_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9._:/-]*$ ]]; then
            echo "Invalid Ollama model name" >&2
            exit 1
          fi
          OCI_NAME=$(printf '%s' "$ARTIFACT_NAME" | tr '[:upper:]' '[:lower:]')
          if [[ ! "$OCI_NAME" =~ ^[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*$ ]]; then
            echo "Artifact name must be a single GHCR repository component" >&2
            exit 1
          fi
          REPOSITORY=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          ARTIFACT="$RUNNER_TEMP/model-artifact"
          # Download directly into the bundle instead of duplicating large blobs.
          OLLAMA_MODELS="$ARTIFACT"
          {
            printf 'OCI_REF=%s/%s/%s:latest\n' "$REGISTRY" "$REPOSITORY" "$OCI_NAME"
            printf 'ARTIFACT=%s\n' "$ARTIFACT"
            printf 'OLLAMA_MODELS=%s\n' "$OLLAMA_MODELS"
          } >> "$GITHUB_ENV"
          mkdir -p "$ARTIFACT" "$OLLAMA_MODELS"

      - name: Install Ollama
        run: |
          case "$RUNNER_OS" in
            macOS)
              OLLAMA_RUNTIME="$RUNNER_TEMP/ollama-runtime"
              mkdir -p "$OLLAMA_RUNTIME"
              curl -fsSL --retry 3 \
                https://github.com/ollama/ollama/releases/latest/download/ollama-darwin.tgz \
                --output "$RUNNER_TEMP/ollama-darwin.tgz"
              # Keep the executable and MLX libraries together in their release layout.
              tar -xzf "$RUNNER_TEMP/ollama-darwin.tgz" -C "$OLLAMA_RUNTIME"
              test -x "$OLLAMA_RUNTIME/ollama"
              test -n "$(find "$OLLAMA_RUNTIME" -name libmlxc.dylib -print -quit)"
              printf '%s\n' "$OLLAMA_RUNTIME" >> "$GITHUB_PATH"
              ;;
            Linux)
              curl -fsSL https://ollama.com/install.sh | sudo bash
              ;;
            *)
              echo "Unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

      - name: Start Ollama
        run: |
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          OLLAMA_PID=$!
          for _ in {1..100}; do
            if curl -fsS --connect-timeout 2 --max-time 5 "http://${OLLAMA_HOST}/api/version" > /dev/null 2>&1; then
              echo "Ollama is ready!"
              exit 0
            fi
            if ! kill -0 "$OLLAMA_PID" 2>/dev/null; then
              break
            fi
            sleep 3
          done
          cat "$RUNNER_TEMP/ollama.log" >&2
          echo "Ollama failed to become ready" >&2
          exit 1

      - name: Pull and verify model
        run: |
          ollama pull "$MODEL_NAME"
          ollama show "$MODEL_NAME"
          ollama list

      - name: Export model files
        run: |
          test -n "$(find "$OLLAMA_MODELS/blobs" -type f -print -quit)"
          test -n "$(find "$OLLAMA_MODELS/manifests" -type f -print -quit)"
          printf 'model=%s\n' "$MODEL_NAME" > "$ARTIFACT/info.txt"

      - name: Add disconnected script
        run: |
          cp "${GITHUB_WORKSPACE}/scripts/disconnected-setup.sh" "$ARTIFACT/disconnected-setup.sh"
          chmod +x "$ARTIFACT/disconnected-setup.sh"

      - name: Install ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Push to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | oras login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          cd "$ARTIFACT"
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}:application/octet-stream")
          done < <(find . -type f -print0)
          oras push "$OCI_REF" "${files[@]}" \
            --artifact-type application/vnd.ollama.model.v1 \
            --annotation "model.source=ollama" \
            --annotation "model.name=$MODEL_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ollama-${{ github.event.inputs.artifact_name }}
          path: ${{ env.ARTIFACT }}
          compression-level: 0
          retention-days: 30

      - name: Summary
        run: |
          {
            printf '## Published\n'
            printf "Model: \`%s\`\n" "$MODEL_NAME"
            printf "OCI: \`%s\`\n" "$OCI_REF"
            printf "Download: \`oras pull %s -o ./model-artifact\`\n" "$OCI_REF"
            printf "Publisher: \`%s/%s\`\n" "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'The target must support the selected model format and runtime (including MLX when required).\n'
          } >> "$GITHUB_STEP_SUMMARY"
