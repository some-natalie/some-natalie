name: 🦙 Publish Ollama Model to GHCR

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Model to publish (e.g., llama3.2:latest)'
        required: true
        type: string
      artifact_name:
        description: 'Artifact name in GHCR'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Ollama
        run: |
          echo "Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sudo bash
          echo "Ollama version:"
          ollama --version || echo "Install completed"

      - name: Start Ollama
        run: |
          echo "Starting Ollama..."
          ollama serve &
          
          echo "Waiting for Ollama API..."
          for i in {1..100}; do
            if curl -sf http://localhost:11434/api/version > /dev/null 2>&1; then
              echo "Ollama is ready!"
              curl -s http://localhost:11434/api/version
              exit 0
            fi
            echo "Waiting... ($i/100)"
            sleep 3
          done
          
          echo "ERROR: Ollama failed to start"
          exit 1

      - name: Pull model (GGUF file)
        run: |
          MODEL="${{ github.event.inputs.model_name }}"
          echo "Pulling model: $MODEL"
          ollama pull "$MODEL"

      - name: Verify pull
        run: |
          echo "Installed models:"
          ollama list || true
          MODEL="${{ github.event.inputs.model_name }}"
          if ollama list | grep -q "$MODEL"; then
            echo "Model successfully pulled: $MODEL"
          else
            echo "WARNING: Model may need verification"
          fi

      - name: Prepare artifact
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifact"
          echo "ARTIFACT=${GITHUB_WORKSPACE}/artifact" >> $GITHUB_ENV

      - name: Export model files
        run: |
          set -euo pipefail
          OLLAMA_MODELS="/root/.ollama/models"
          ARTIFACT="${GITHUB_WORKSPACE}/artifact"
          
          echo "Ollama models location: $OLLAMA_MODELS"
          ls -la "$OLLAMA_MODELS" 2>/dev/null || echo "Ollama models dir not found"
          
          # Copy blobs (the GGUF file and other model data)
          if [ -d "$OLLAMA_MODELS/blobs" ]; then
            mkdir -p "${ARTIFACT}/ollama-blobs"
            cp -r "$OLLAMA_MODELS/blobs"/* "${ARTIFACT}/ollama-blobs/" 2>/dev/null || true
            echo "Copied blobs"
          fi
          
          # Copy manifests
          if [ -d "$OLLAMA_MODELS/manifests" ]; then
            mkdir -p "${ARTIFACT}/ollama-manifests"
            cp -r "$OLLAMA_MODELS/manifests"/* "${ARTIFACT}/ollama-manifests/" 2>/dev/null || true
            echo "Copied manifests"
          fi
          
          # Add metadata
          echo "model=${{ github.event.inputs.model_name }}" > "${ARTIFACT}/info.txt"
          echo "artifact=${{ github.event.inputs.artifact_name }}" >> "${ARTIFACT}/info.txt"

      - name: Add disconnected script
        run: |
          cp "${GITHUB_WORKSPACE}/scripts/disconnected-setup.sh" "${GITHUB_WORKSPACE}/artifact/disconnected-setup.sh"
          chmod +x "${GITHUB_WORKSPACE}/artifact/disconnected-setup.sh"

      - name: Install ORAS
        uses: oras-project/setup-oras@v2
        with:
          oras-version: v1.2.1

      - name: Push to GHCR
        run: |
          ARTIFACT="${GITHUB_WORKSPACE}/artifact"
          OCI_NAME="${{ github.event.inputs.artifact_name }}"
          OCI_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${OCI_NAME}:latest"
          
          echo "Pushing to: $OCI_REF"
          
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login "${{ env.REGISTRY }}" \
            -u "${{ github.actor }}" --password-stdin
          
          echo "Files being pushed:"
          find "${ARTIFACT}" -type f
          
          for f in $(find "${ARTIFACT}" -type f); do
            REL="${f#${ARTIFACT}/}"
            oras push "${OCI_REF}" "${REL}=${f}" \
              --annotation "model.source=ollama" \
              --annotation "model.name=${{ github.event.inputs.model_name }}" || true
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-${{ github.event.inputs.artifact_name }}
          path: ${{ env.ARTIFACT }}
          retention-days: 30

      - name: Summary
        run: |
          OCI_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ github.event.inputs.artifact_name }}:latest"
          echo "## Published" >> $GITHUB_STEP_SUMMARY
          echo "- Model: \`${{ github.event.inputs.model_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- OCI: \`${OCI_REF}\`" >> $GITHUB_STEP_SUMMARY