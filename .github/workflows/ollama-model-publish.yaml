name: 🦙 Publish Ollama Model to GHCR

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Model to publish (e.g., llama3.2:latest)'
        required: true
        type: string
      artifact_name:
        description: 'Artifact name in GHCR'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Ollama
        run: |
          # Download and install Ollama
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64) ARCH=arm64 ;;
          esac

          TARBALL=ollama-linux-$ARCH.tar.gz
          curl -fsSLO "https://ollama.com/download/$TARBALL"
          sudo tar -C /usr -xzf "$TARBALL"
          rm "$TARBALL"

          # Setup user
          sudo useradd -r -s /bin/false -U -m -d /usr/share/ollama ollama 2>/dev/null || true
          sudo usermod -a -G ollama "$(whoami)"

      - name: Start Ollama
        run: |
          # Start Ollama server in background
          ollama serve &
          sleep 8

          # Wait for API to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:11434/api/version > /dev/null 2>&1; then
              echo "Ollama is ready"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

          echo "ERROR: Ollama failed to start"
          exit 1

      - name: Pull model
        run: ollama pull "${{ github.event.inputs.model_name }}"

      - name: Prepare artifact
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifact"

      - name: Export model files
        run: |
          set -euo pipefail
          OLLAMA_MODELS="/root/.ollama/models"

          # Copy blobs
          if [ -d "${OLLAMA_MODELS}/blobs" ]; then
            mkdir -p "${GITHUB_WORKSPACE}/artifact/ollama-blobs"
            cp -r "${OLLAMA_MODELS}/blobs" "${GITHUB_WORKSPACE}/artifact/ollama-blobs/" 2>/dev/null || true
          fi

          # Copy manifests
          if [ -d "${OLLAMA_MODELS}/manifests" ]; then
            mkdir -p "${GITHUB_WORKSPACE}/artifact/ollama-manifests"
            cp -r "${OLLAMA_MODELS}/manifests" "${GITHUB_WORKSPACE}/artifact/ollama-manifests/" 2>/dev/null || true
          fi

          # Add metadata
          echo "model=${{ github.event.inputs.model_name }}" > "${GITHUB_WORKSPACE}/artifact/info.txt"

      - name: Add disconnected script
        run: |
          cp "${GITHUB_WORKSPACE}/scripts/disconnected-setup.sh" "${GITHUB_WORKSPACE}/artifact/disconnected-setup.sh"
          chmod +x "${GITHUB_WORKSPACE}/artifact/disconnected-setup.sh"

      - name: Install ORAS
        uses: oras-project/setup-oras@v2

      - name: Push to GHCR
        run: |
          ARTIFACT="${GITHUB_WORKSPACE}/artifact"
          OCI_NAME="${{ github.event.inputs.artifact_name }}"

          OCI_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${OCI_NAME}:latest"

          echo "${{ secrets.GITHUB_TOKEN }}" | oras login "${{ env.REGISTRY }}" \
            -u "${{ github.actor }}" --password-stdin

          for f in $(find "${ARTIFACT}" -type f); do
            REL="${f#${ARTIFACT}/}"
            oras push "${OCI_REF}" "${REL}=${f}" \
              --annotation "model.source=ollama" \
              --annotation "model.name=${{ github.event.inputs.model_name }}" || true
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-${{ github.event.inputs.artifact_name }}
          path: ${{ env.ARTIFACT }}
          retention-days: 30

      - name: Summary
        run: |
          OCI_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ github.event.inputs.artifact_name }}:latest"
          echo "Model: \`${{ github.event.inputs.model_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "OCI: \`${OCI_REF}\`" >> $GITHUB_STEP_SUMMARY
