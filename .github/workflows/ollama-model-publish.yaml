# =============================================================================
# GitHub Action: Publish Ollama Model to GitHub Packages (GHCR)
# =============================================================================
# This workflow:
# 1. Pulls a model from the Ollama registry using ollama pull
# 2. Exports model files from ollama's model store
# 3. Pushes the model to GHCR as an OCI artifact
# 4. Provides a disconnected setup script for offline use
# =============================================================================

name: Publish Ollama Model to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Ollama model to publish (e.g., llama3.2:latest)'
        required: true
        type: string
      artifact_name:
        description: 'Name for the artifact in GHCR'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Ollama
        uses: ollama/ollama-action@v1
        with:
          version: latest

      - name: Start Ollama
        run: |
          ollama serve &
          sleep 5
          curl -sf http://localhost:11434/api/version || exit 1

      - name: Pull model
        run: ollama pull "${{ github.event.inputs.model_name }}"

      - name: Prepare artifact directory
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifact"
          echo "ARTIFACT=${GITHUB_WORKSPACE}/artifact" >> $GITHUB_ENV

      - name: Export model files
        run: |
          set -euo pipefail
          OLLAMA_MODELS="/root/.ollama/models"
          
          if [ -d "${OLLAMA_MODELS}/blobs" ]; then
            cp -r "${OLLAMA_MODELS}/blobs" "${ARTIFACT}/ollama-blobs/"
          fi
          
          if [ -d "${OLLAMA_MODELS}/manifests" ]; then
            cp -r "${OLLAMA_MODELS}/manifests" "${ARTIFACT}/ollama-manifests/"
          fi
          
          echo "model=${{ github.event.inputs.model_name }}" > "${ARTIFACT}/info.txt"

      - name: Add disconnected setup script
        run: |
          cp "${GITHUB_WORKSPACE}/scripts/disconnected-setup.sh" "${ARTIFACT}/disconnected-setup.sh"
          chmod +x "${ARTIFACT}/disconnected-setup.sh"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-${{ github.event.inputs.artifact_name }}
          path: ${{ env.ARTIFACT }}
          retention-days: 90

      - name: Push to GHCR
        uses: oras-project/setup-oras@v2

      - name: Publish to GHCR
        run: |
          OCI_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ github.event.inputs.artifact_name }}:latest"
          ARTIFACT="${{ env.ARTIFACT }}"
          
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          
          for file in $(find "${ARTIFACT}" -type f); do
            REL="${file#${ARTIFACT}/}"
            oras push "${OCI_REF}" "${REL}=${file}" \
              --annotation "model.source=ollama" \
              --annotation "model.name=${{ github.event.inputs.model_name }}" || true
          done
          
          echo "Published: ${OCI_REF}"

      - name: Summary
        run: |
          OCI_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ github.event.inputs.artifact_name }}:latest"
          echo "## Model Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Model: \`${{ github.event.inputs.model_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "OCI: \`${OCI_REF}\`" >> $GITHUB_STEP_SUMMARY

      - name: Verify artifact
        run: |
          OCI_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ github.event.inputs.artifact_name }}:latest"
          oras manifest fetch "${OCI_REF}" || echo "Check GHCR for artifact"