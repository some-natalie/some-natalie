name: 🔍 Update secret patterns

# Refreshes local-ai/open-webui/acp-ui/secret-patterns.json from mazen160/secrets-patterns-db.
#
# A real ClickHouse is a service container here, not a convenience: the generator keeps only
# the patterns ClickHouse will accept inside multiMatchAllIndices, and it decides that by
# probing a live server. Vectorscan rejects patterns it judges too slow, so the triage result
# depends on the ClickHouse build. The image is pinned to the same version as the compose
# stack in local-ai/open-webui so CI and local runs agree on what is usable.

on:
  workflow_dispatch:
  schedule:
    - cron: 0 6 1 * * # first of the month, after upstream has had time to settle
  pull_request:
    paths:
      - local-ai/open-webui/update-secret-patterns.py
      - .github/workflows/update-secret-patterns.yaml

permissions:
  contents: read

jobs:
  update:
    name: Regenerate pattern file
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.7.5.10
        env:
          CLICKHOUSE_USER: acp
          CLICKHOUSE_PASSWORD: test
        ports:
          - 8123:8123

    env:
      ACP_TAP_URL: http://127.0.0.1:8123/
      ACP_TAP_USER: acp
      ACP_TAP_PASSWORD: test

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: check tooling
        run: |
          set -euo pipefail
          yq --version
          python3 --version

      - name: wait for clickhouse
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8123/?user=acp&password=test" --data-binary "SELECT 1" >/dev/null; then
              echo "clickhouse ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::clickhouse did not become ready in 30s"
          exit 1

      - name: regenerate
        working-directory: local-ai/open-webui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # only to avoid anonymous API rate limits
        run: ./update-secret-patterns.py

      - name: summarise
        working-directory: local-ai/open-webui
        run: |
          set -euo pipefail
          {
            echo "### Secret pattern refresh"
            echo
            python3 - <<'PY'
          import json
          d = json.load(open("acp-ui/secret-patterns.json"))
          print(f"- upstream rules: **{d['upstream_count']}**")
          print(f"- usable here: **{len(d['patterns'])}**")
          print(f"- dropped, too slow for vectorscan: **{len(d['dropped_expensive'])}**")
          print(f"- dropped, would not compile: **{len(d['dropped_invalid'])}**")
          kinds = {}
          for p in d["patterns"]:
              kinds[p["kind"]] = kinds.get(p["kind"], 0) + 1
          print(f"- rated secret: **{kinds.get('secret', 0)}**, identifier: **{kinds.get('identifier', 0)}**")
          PY
            echo
            if git diff --quiet -- acp-ui/secret-patterns.json; then
              echo "No change to the pattern file."
            else
              git --no-pager diff --stat -- acp-ui/secret-patterns.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Nothing is pushed on pull_request runs; that trigger only proves the generator
      # still works when the script or this workflow changes.
      - name: open a pull request
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: local-ai/open-webui/acp-ui/secret-patterns.json
          branch: chore/secret-patterns
          delete-branch: true
          commit-message: "Refresh vendored secret detection patterns"
          title: "Refresh vendored secret detection patterns"
          body: |
            Regenerated `local-ai/open-webui/acp-ui/secret-patterns.json` from
            [mazen160/secrets-patterns-db](https://github.com/mazen160/secrets-patterns-db)
            (`db/rules-stable.yml`, CC-BY-SA-4.0).

            Patterns are re-triaged against ClickHouse
            `26.7.5.10` on every run, so a rule can appear or disappear purely because
            vectorscan changed its mind about the cost — not only because upstream edited it.

            The `kind` field (secret vs identifier) is added by
            `update-secret-patterns.py` and is not upstream data. See the step summary for
            counts.
