<!doctype html>
<meta charset="utf-8">
<title>acp · secrets</title>
<link rel="stylesheet" href="app.css">
<style>
  /* Dashboard kit (cards, tiles, bars, columns, tooltip) lives in app.css. */
  main { padding: 16px; display: grid; gap: 16px; max-width: 1100px }
  .card tr.pick { cursor: pointer }
  .card tr.pick:hover td { background: var(--bg) }
  .card tr[aria-selected=true] td { background: var(--bg); box-shadow: inset 3px 0 var(--user) }
  .tag {
    font-size: 11px; padding: 1px 6px; border-radius: 3px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
  }
  .tag.secret { color: var(--viz-crit); border-color: var(--viz-crit) }
  code { font: inherit; color: var(--tool); overflow-wrap: anywhere }
</style>

<header></header>
<main>
  <section class="card"><div class="kpis" id="kpis"></div></section>
  <section class="card">
    <h2>Patterns that matched</h2>
    <p class="sub" id="sub-hits"></p>
    <div id="c-hits"></div>
  </section>
  <section class="card">
    <h2>Occurrences</h2>
    <p class="sub" id="sub-detail">Pick a pattern above to see where it matched. Matched values are masked.</p>
    <div id="c-detail"></div>
  </section>
</main>
<footer id="notes"></footer>

<script src="app.js"></script>
<script>
  // Patterns are vendored in secret-patterns.json, generated by update-secret-patterns.py.
  // Upstream is mazen160/secrets-patterns-db (CC-BY-SA-4.0); attribution is in that file
  // and in the footer below.
  //
  // Matching runs server-side through multiMatchAllIndices, which ClickHouse evaluates
  // with vectorscan in one pass, so 1400+ regexes over the whole table stay subsecond.
  // The generator already dropped the patterns ClickHouse rejects as too slow.
  //
  // Matched values are never rendered in full. Triage needs the prefix (AKIA, ghp_,
  // arn:aws:) to judge a false positive, so previews keep a head and tail and mask the
  // middle. Nothing here should paste a live credential into a browser tab.
  const chEsc = (s) => s.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
  const arrayLit = (pats) => "[" + pats.map(p => "'" + chEsc(p.regex) + "'").join(",") + "]";

  let DB = null;      // the whole pattern file
  let ACTIVE = [];    // patterns matching the current filters, in query order
  let DATA = null;
  let picked = null;

  const filters = () => ({
    conf: $("f-conf").value,
    kind: $("f-kind").value,
  });

  function selectPatterns() {
    const { conf, kind } = filters();
    return DB.patterns.filter(p =>
      (conf === "all" || p.confidence === conf) &&
      (kind === "all" || p.kind === kind));
  }

  // One row per (message, matching pattern). arrayJoin over the index list turns the
  // per-row match array into countable rows.
  const hitsQuery = (pats) => `
    SELECT idx, count() AS hits, uniqExact(session_id) AS sessions,
           min(ts) AS first_ts, max(ts) AS last_ts
    FROM (
      SELECT arrayJoin(multiMatchAllIndices(raw, ${arrayLit(pats)})) AS idx, session_id, ts
      FROM acp.messages
    )
    GROUP BY idx ORDER BY hits DESC`;

  // Run for a single pattern so extract() gets the right one. Two traps here:
  //   * extract() returns the first capture GROUP, not the whole match, so a pattern like
  //     (AKIA|ASIA)[A-Z0-9]{16} yielded just "AKIA". Wrapping the whole regex in a group
  //     makes group 1 the full match.
  //   * some upstream regexes end in .+ (AWS ARN does), which greedily eats the rest of the
  //     JSON line. Clamping to 80 keeps one bad rule from hauling back kilobytes, while
  //     true_len still exposes the over-match so it reads as the false positive it is.
  // Preview keeps a 6-char head and 2-char tail: enough to recognise AKIAIO••••••LE as
  // AWS's documentation key, not enough to be a usable credential.
  const detailQuery = (p) => `
    WITH extract(raw, '(${chEsc(p.regex)})') AS full, substring(full, 1, 80) AS m
    SELECT ts, session_id AS sid,
           JSONExtractString(raw, 'method') AS method,
           JSONExtractString(raw, 'params', 'update', '_meta', 'claudeCode', 'toolName') AS tool,
           if(length(m) <= 10, repeat('•', 8),
              concat(substring(m, 1, 6), '••••••', substring(m, length(m) - 1, 2))) AS masked,
           length(full) AS true_len
    FROM acp.messages
    WHERE full != '' ORDER BY ts DESC LIMIT 40`;

  function paint() {
    const rows = DATA.map(r => ({ ...r, p: ACTIVE[Number(r.idx) - 1] })).filter(r => r.p);
    const hits = rows.reduce((a, r) => a + Number(r.hits), 0);
    const secretRows = rows.filter(r => r.p.kind === "secret");
    const sessions = new Set();
    for (const r of rows) sessions.add(r.sessions);

    const k = $("kpis");
    k.textContent = "";
    k.append(
      tileNode({ label: "Matches", value: hits.toLocaleString(), hero: true,
                 foot: `${rows.length} of ${ACTIVE.length.toLocaleString()} active patterns matched` }),
      tileNode({ label: "Rated secret", value: secretRows.length.toLocaleString(),
                 foot: `${secretRows.reduce((a, r) => a + Number(r.hits), 0).toLocaleString()} matches` }),
      tileNode({ label: "Rated identifier", value: (rows.length - secretRows.length).toLocaleString(),
                 foot: "resource names, not credentials" }),
      tileNode({ label: "Patterns loaded", value: DB.patterns.length.toLocaleString(),
                 foot: `${DB.upstream_count} upstream · ${DB.dropped_expensive.length} too slow, dropped` }),
    );
    if (secretRows.length) k.querySelector(".tile:nth-child(2) .value").classList.add("fail");

    $("sub-hits").textContent = rows.length
      ? `Bar length is match count; red is a pattern rated as a credential rather than an ` +
        `identifier. Upstream confidence rates how surely a pattern matches its thing, not ` +
        `whether that thing is sensitive.`
      : `No matches for the current filter.`;

    render("c-hits",
      () => hbars(rows, {
        name: r => r.p.name, value: r => Number(r.hits),
        failed: r => r.p.kind === "secret",
        tipText: r => `${r.p.name}\n${r.p.kind} · ${r.p.confidence} confidence\n` +
                      `${Number(r.hits).toLocaleString()} matches in ` +
                      `${Number(r.sessions).toLocaleString()} session(s)\n` +
                      `${r.first_ts.slice(0, 16)} → ${r.last_ts.slice(0, 16)}`,
      }),
      () => {
        const t = tableNode([
          { h: "pattern", v: r => r.p.name },
          { h: "rated", v: r => r.p.kind },
          { h: "confidence", v: r => r.p.confidence },
          { h: "matches", n: true, v: r => Number(r.hits).toLocaleString() },
          { h: "sessions", n: true, v: r => Number(r.sessions).toLocaleString() },
          { h: "last seen", v: r => r.last_ts.slice(0, 16) },
        ], rows);
        // Rows are clickable in table view; that is where the pattern names are legible.
        [...t.tBodies[0].rows].forEach((tr, i) => {
          tr.className = "pick";
          tr.setAttribute("aria-selected", String(rows[i].p.name === picked));
          tr.onclick = () => showDetail(rows[i].p, t, tr);
        });
        return t;
      });
  }

  async function showDetail(p, table, tr) {
    picked = p.name;
    if (table) {
      for (const row of table.tBodies[0].rows) row.setAttribute("aria-selected", String(row === tr));
    }
    const host = $("c-detail");
    host.textContent = "";
    $("sub-detail").textContent = `${p.name} — rated ${p.kind}, ${p.confidence} confidence. Values masked.`;
    host.append(el("p", "muted", "loading…"));
    try {
      const rows = await query(detailQuery(p));
      host.textContent = "";
      host.append(el("p", "muted", `Regex: ${p.regex}`));
      host.append(tableNode([
        { h: "when", v: r => r.ts.slice(0, 19) },
        { h: "method", v: r => r.method || "—" },
        { h: "tool", v: r => r.tool || "—" },
        { h: "masked value", v: r => r.masked },
        { h: "match len", n: true, v: r => Number(r.true_len).toLocaleString() },
        { h: "session", v: r => r.sid ? r.sid.slice(0, 8) : "—" },
      ], rows));
      if (!rows.length) host.append(el("p", "muted", "No extractable occurrence found."));
    } catch (e) {
      host.textContent = "";
      host.append(el("p", "err", e.message));
    }
  }

  function notes() {
    const n = $("notes");
    n.textContent = "";
    n.append(notesNode([
      `Patterns come from ${DB._source} (${DB._license}). ${DB.upstream_count} upstream rules; ` +
      `${DB.patterns.length} are usable here. ${DB.dropped_expensive.length} were dropped because ` +
      `ClickHouse rejects them as too slow for vectorscan, and ${DB.dropped_invalid.length} would not compile.`,
      `The secret/identifier label is added by update-secret-patterns.py, not by upstream. Upstream ` +
      `confidence rates match certainty, not sensitivity — an AWS ARN rates high and is not a credential. ` +
      `Ambiguous rules are labelled secret, so a Slack webhook URL counts as one even though it is a URL.`,
      `Every match is a candidate, not a finding. Regex detection has no way to tell a live key from an ` +
      `example in documentation, and short high-entropy rules match ordinary text.`,
      `Matched values are masked to a 6-character head and 2-character tail behind a fixed-width mask. ` +
      `That is deliberately enough to recognise a false positive — AKIAIO••••••LE is AWS's documentation ` +
      `key, not a live one — and not enough to use. The match length is shown unmasked, because a ` +
      `four-thousand-character "match" is how you spot a greedy rule like AWS ARN, whose regex ends in .+`,
      `The unmasked text is still in the database and in Zed's own history. This page is triage, not containment: ` +
      `if something here is live, rotate it.`,
      `The scan covers the whole recorded JSON-RPC line, so it reaches command lines, tool output, file ` +
      `contents written via Write, prompts and agent replies.`,
      `The tap logs the session you are reading this from, so triaging a secret here records the act of triaging it.`,
    ]));
  }

  async function load() {
    setStatus("loading patterns…");
    try {
      if (!DB) {
        const res = await fetch("secret-patterns.json");
        if (!res.ok) throw new Error(`secret-patterns.json: HTTP ${res.status} — run update-secret-patterns.py`);
        DB = await res.json();
      }
      ACTIVE = selectPatterns();
      if (!ACTIVE.length) {
        setStatus("no patterns match that filter", true);
        return;
      }
      setStatus(`scanning with ${ACTIVE.length.toLocaleString()} patterns…`);
      DATA = await query(hitsQuery(ACTIVE));
      picked = null;
      paint();
      notes();
      const hits = DATA.reduce((a, r) => a + Number(r.hits), 0);
      setStatus(`${hits.toLocaleString()} matches from ${DATA.length} pattern(s)`);
    } catch (e) {
      setStatus(e.message, true);
    }
  }

  mountHeader({
    current: "secrets.html",
    extraHTML: `
      <label>rated
        <select id="f-kind">
          <option value="all" selected>all</option>
          <option value="secret">secret</option>
          <option value="identifier">identifier</option>
        </select>
      </label>
      <label>confidence
        <select id="f-conf">
          <option value="high" selected>high</option>
          <option value="low">low</option>
          <option value="all">all</option>
        </select>
      </label>`,
    onReload: load,
    onToggleView: () => { if (DATA) paint() },
  });
  for (const id of ["f-kind", "f-conf"]) $(id).onchange = load;
  load();
</script>
