<!doctype html>
<meta charset="utf-8">
<title>acp · secrets</title>
<link rel="stylesheet" href="app.css">
<style>
  /* Dashboard kit (cards, tiles, donut, line, heatmap, tables, tooltip) lives in app.css. */
  main { padding: 16px; display: grid; gap: 16px }
  .card tr.pick { cursor: pointer }
  .card tr.pick:hover td { background: var(--bg) }
  .card tr[aria-selected=true] td { background: var(--bg); box-shadow: inset 3px 0 var(--user) }
  code { font: inherit; color: var(--dim); overflow-wrap: anywhere }
  code.shown { color: var(--tool) }
  .val { display: inline-flex; gap: 8px; align-items: baseline }
  /* In a cell the button right-aligns so the column of them lines up; inline it just follows. */
  td .val { display: flex; justify-content: space-between }
  .reveal { padding: 0 5px; font-size: 11px; color: var(--dim); flex: none }
</style>

<header></header>
<main>
  <section class="card"><div class="kpis" id="kpis"></div></section>
  <section class="card">
    <h2>Distinct values found</h2>
    <p class="sub" id="sub-hits"></p>
    <div id="c-hits"></div>
  </section>
  <section class="card">
    <h2>Where it appeared</h2>
    <p class="sub" id="sub-detail">Pick a value above to see every message it turned up in.</p>
    <div id="c-detail"></div>
  </section>
</main>
<footer id="notes"></footer>

<script src="app.js"></script>
<script>
  // Patterns are vendored in secret-patterns.json, generated by update-secret-patterns.py.
  // Upstream is mazen160/secrets-patterns-db (CC-BY-SA-4.0); attribution is in that file
  // and in the footer below.
  //
  // Matching runs server-side through multiMatchAllIndices, which ClickHouse evaluates
  // with vectorscan in one pass, so 1400+ regexes over the whole table stay subsecond.
  // The generator already dropped the patterns ClickHouse rejects as too slow.
  //
  // Values are masked on arrival and revealed only by an explicit per-value click. Triage is
  // the whole point of the page and you cannot always judge a candidate from its prefix, so
  // the full text has to be reachable — but never by default, and never in bulk.
  const chEsc = (s) => s.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
  const arrayLit = (pats) => "[" + pats.map(p => "'" + chEsc(p.regex) + "'").join(",") + "]";

  let DB = null;      // the whole pattern file
  let ACTIVE = [];    // patterns matching the current filters, in query order
  let DATA = null;    // per-pattern match counts
  let VALUES = [];    // one row per distinct extracted value, pattern attached
  let picked = null;

  const filters = () => ({
    conf: $("f-conf").value,
    kind: $("f-kind").value,
  });

  function selectPatterns() {
    const { conf, kind } = filters();
    return DB.patterns.filter(p =>
      (conf === "all" || p.confidence === conf) &&
      (kind === "all" || p.kind === kind));
  }

  // One row per (message, matching pattern). arrayJoin over the index list turns the
  // per-row match array into countable rows.
  const hitsQuery = (pats) => `
    SELECT idx, count() AS hits, uniqExact(session_id) AS sessions,
           min(ts) AS first_ts, max(ts) AS last_ts
    FROM (
      SELECT arrayJoin(multiMatchAllIndices(raw, ${arrayLit(pats)})) AS idx, session_id, ts
      FROM acp.messages
    )
    GROUP BY idx ORDER BY hits DESC`;

  // The counts above are per pattern, which overstates the problem: one token pasted into 400
  // shell commands is one secret to rotate, not 400 findings. So group by the extracted value.
  //
  // Four traps in here:
  //   * extract/extractAll return the first capture GROUP, not the whole match, so a pattern
  //     like (AKIA|ASIA)[A-Z0-9]{16} yielded just "AKIA". Wrapping the whole regex in a group
  //     makes group 1 the full match.
  //   * the needle must be a literal, so the patterns are unrolled into an array of
  //     (index, matches) tuples rather than indexed dynamically.
  //   * ORDER BY must not name the `val` alias. Sorting on a computed expression over the
  //     GROUP BY key sends the plan optimizer past its 10,000-optimization ceiling and the
  //     query dies with TOO_MANY_QUERY_PLAN_OPTIMIZATIONS. Ordering by hits alone is fine.
  //   * some upstream regexes end in .+ (AWS ARN does) and greedily eat the rest of the JSON
  //     line. Grouping is on the untruncated value so distinctness stays exact, but only the
  //     first VALUE_MAX characters come back; `len` exposes the over-match.
  const VALUE_MAX = 200, VALUE_LIMIT = 2000;
  const valuesQuery = (pats) => `
    SELECT idx, substring(v, 1, ${VALUE_MAX}) AS val, length(v) AS len, count() AS hits,
           uniqExact(sid) AS sessions, min(ts) AS first_ts, max(ts) AS last_ts
    FROM (
      SELECT sid, ts, pair.1 AS idx, arrayJoin(pair.2) AS v
      FROM (
        SELECT session_id AS sid, ts, arrayJoin([${pats.map((p, i) =>
          `tuple(toUInt16(${i + 1}), extractAll(raw, '(${chEsc(p.regex)})'))`).join(",")}]) AS pair
        FROM acp.messages WHERE multiMatchAny(raw, ${arrayLit(pats)})
      )
    )
    WHERE v != '' GROUP BY idx, v ORDER BY hits DESC LIMIT ${VALUE_LIMIT}`;

  // Every message a given value appears in, plus the text around it. The context matters because
  // plenty of upstream rules match the *name* of a credential rather than its value — github_token
  // is literally github[_-]?token(=| =|:| :) — so the match itself holds no secret and the thing
  // worth reading is whatever follows it.
  //
  // toInt64 before subtracting: position() returns UInt64, so pos - CONTEXT_PAD underflows to a
  // vast number for a match near the start of the line, and substring then returns nothing.
  const CONTEXT_PAD = 32, CONTEXT_LEN = 220;
  const wherePlaced = `
    SELECT ts, session_id AS sid,
           JSONExtractString(raw, 'method') AS method,
           JSONExtractString(raw, 'params', 'update', '_meta', 'claudeCode', 'toolName') AS tool,
           substring(raw, greatest(toInt64(position(raw, {val:String})) - ${CONTEXT_PAD}, 1),
                     ${CONTEXT_LEN}) AS context
    FROM acp.messages WHERE position(raw, {val:String}) > 0 ORDER BY ts DESC LIMIT 60`;

  // Secrets, not promises of secrets. Two rules, both cheap, both about the value rather than the
  // rule that found it:
  //   * a match with no credential material in it. github_token(=| :) captures the assignment and
  //     stops, so it can never hold a secret; aws_secret_access_key is a variable name. Material
  //     means a 16+ run from a credential charset that mixes digits with letters, or is long hex
  //     or base64 — the shapes a generated credential actually takes.
  //   * an Actions pin. If the material is exactly 40 hex and every occurrence sits behind an @ or
  //     a sha key, it is a pinned action, not a classic PAT.
  const RUN = /[A-Za-z0-9+/=_-]{16,}/g;
  const KEY_HEADER = /BEGIN [A-Z0-9 ]*(PRIVATE KEY|PGP)/i;
  // 40 hex is a git SHA and also the shape of a pre-ghp_ classic PAT, so something has to break
  // the tie. Enumerating SHA contexts does not converge — action pins, `100644 <sha>` from
  // ls-tree, "bump X from <sha>", ?ref=, version→SHA maps — so the test is inverted: a bare 40
  // hex is a SHA unless a credential word sits in the match with it. Only the rule that requires
  // "github" near 40 hex produces these, so nothing else is affected: ghp_ tokens, AKIA keys and
  // key headers all take other shapes.
  const HEX40 = /\b[0-9a-f]{40}\b/;
  const CRED_WORD = /(token|secret|password|passwd|api[_-]?key|apikey|auth|credential)/i;
  const material = (s) => (s.match(RUN) || [])
    .filter(r => (/[0-9]/.test(r) && /[A-Za-z]/.test(r)) || /^[0-9a-f]{32,}$/i.test(r))
    .sort((a, b) => b.length - a.length)[0] || "";

  function noiseReason(r) {
    // A -----BEGIN PRIVATE KEY----- line carries no material itself; the key body is the bytes
    // right after it, which is exactly the leak. Never filter these.
    if (KEY_HEADER.test(r.val)) return null;
    if (!material(r.val)) return "no credential material";
    if (HEX40.test(r.val) && !CRED_WORD.test(r.val)) return "git SHA, not a PAT";
    return null;
  }

  // Enough to recognise AKIAIO••••••LE as AWS's documentation key, not enough to use. Below 20
  // characters a head and tail would show more of the value than it hid, so mask the lot; every
  // credential shape worth previewing (AWS keys, GitHub tokens) is longer than that anyway.
  const mask = (s) => s.length < 20 ? "•".repeat(8) : s.slice(0, 6) + "••••••" + s.slice(-2);

  // Masked until asked. Hover would reveal every value the cursor crossed on its way down the
  // table, so it takes a click, and the click does not select the row.
  function revealNode(full, placeholder) {
    const wrap = el("span", "val");
    const code = el("code", null, placeholder);
    const btn = el("button", "reveal", "reveal");
    let shown = false;
    btn.onclick = (e) => {
      e.stopPropagation();
      shown = !shown;
      code.textContent = shown ? full : placeholder;
      code.classList.toggle("shown", shown);
      btn.textContent = shown ? "hide" : "reveal";
    };
    wrap.append(code, btn);
    return wrap;
  }

  const valueCell = (r) =>
    revealNode(r.val + (Number(r.len) > VALUE_MAX ? "…" : ""), mask(r.val));

  function paint() {
    const pats = DATA.map(r => ({ ...r, p: ACTIVE[Number(r.idx) - 1] })).filter(r => r.p);
    const kept = [], filtered = [];
    for (const r of VALUES) {
      const why = noiseReason(r);
      (why ? filtered : kept).push(why ? { ...r, why } : r);
    }
    const occurrences = kept.reduce((a, r) => a + Number(r.hits), 0);
    const secrets = kept.filter(r => r.p.kind === "secret");
    const repeated = kept.filter(r => Number(r.hits) > 1);

    const k = $("kpis");
    k.textContent = "";
    k.append(
      tileNode({ label: "Candidate secrets", value: kept.length.toLocaleString(), hero: true,
                 foot: `${occurrences.toLocaleString()} occurrences, across ` +
                       `${pats.length} of ${ACTIVE.length.toLocaleString()} active patterns` }),
      tileNode({ label: "Rated secret", value: secrets.length.toLocaleString(),
                 foot: `candidates from patterns rated a credential` }),
      tileNode({ label: "Seen more than once", value: repeated.length.toLocaleString(),
                 foot: kept.length ? `busiest appears ${Number(kept[0].hits).toLocaleString()} times ` +
                       `(${kept[0].p.name})` : "" }),
      tileNode({ label: "Over-matches", value: kept.filter(r => Number(r.len) > VALUE_MAX).length.toLocaleString(),
                 foot: `longer than ${VALUE_MAX} chars — a greedy rule, not a credential` }),
      tileNode({ label: "Filtered out", value: filtered.length.toLocaleString(),
                 foot: `of ${VALUES.length.toLocaleString()} distinct values — listed below` }),
    );
    if (secrets.length) k.querySelector(".tile:nth-child(2) .value").classList.add("fail");

    $("sub-hits").textContent = kept.length
      ? `One row per distinct value that holds credential material, most-repeated first, masked ` +
        `until you reveal it. Click a row to see every message it appeared in.` +
        (VALUES.length === VALUE_LIMIT ? ` Capped at ${VALUE_LIMIT} before filtering.` : "")
      : VALUES.length ? `Every match for this filter was a keyword or an Actions pin — nothing ` +
        `with credential material in it.` : `No matches for the current filter.`;

    const host = $("c-hits");
    host.textContent = "";
    const cols = [
      { h: "value", v: valueCell },
      { h: "pattern", v: r => r.p.name },
      { h: "rated", v: r => r.p.kind, cls: r => r.p.kind === "secret" ? "fail" : "" },
      { h: "seen", n: true, v: r => Number(r.hits).toLocaleString() },
      { h: "sessions", n: true, v: r => Number(r.sessions).toLocaleString() },
      { h: "len", n: true, v: r => Number(r.len).toLocaleString() },
      { h: "last seen", v: r => r.last_ts.slice(0, 16) },
    ];
    const t = tableNode(cols, kept);
    [...t.tBodies[0].rows].forEach((tr, i) => {
      tr.className = "pick";
      tr.setAttribute("aria-selected", String(kept[i].val === picked));
      tr.onclick = () => showDetail(kept[i], t, tr);
    });
    const box = el("div", "scroll");
    box.append(t);
    host.append(box);

    // Filtered rows stay reachable. A detector that quietly drops things is a detector you
    // cannot audit, and both rules above are heuristics.
    if (filtered.length) {
      const d = el("details"), fb = el("div", "scroll");
      fb.append(tableNode([
        { h: "why", v: r => r.why },
        ...cols.slice(0, 2),
        { h: "seen", n: true, v: r => Number(r.hits).toLocaleString() },
        { h: "len", n: true, v: r => Number(r.len).toLocaleString() },
      ], filtered));
      d.append(el("summary", null, `${filtered.length} filtered out — keywords and Actions pins`), fb);
      host.append(d);
    }

    // The per-pattern rollup the bar chart used to be, kept for judging which rule is noisy.
    const roll = el("details"), rb = el("div", "scroll");
    rb.append(tableNode([
      { h: "pattern", v: r => r.p.name },
      { h: "rated", v: r => r.p.kind, cls: r => r.p.kind === "secret" ? "fail" : "" },
      { h: "confidence", v: r => r.p.confidence },
      { h: "candidates", n: true, v: r => kept.filter(v => v.p === r.p).length.toLocaleString() },
      { h: "filtered", n: true, v: r => filtered.filter(v => v.p === r.p).length.toLocaleString() },
      { h: "messages", n: true, v: r => Number(r.hits).toLocaleString() },
      { h: "last seen", v: r => r.last_ts.slice(0, 16) },
    ], pats));
    roll.append(el("summary", null, `${pats.length} patterns that matched`), rb);
    host.append(roll);
  }

  async function showDetail(r, table, tr) {
    picked = r.val;
    if (table) {
      for (const row of table.tBodies[0].rows) row.setAttribute("aria-selected", String(row === tr));
    }
    const host = $("c-detail");
    host.textContent = "";
    $("sub-detail").textContent =
      `${r.p.name} — rated ${r.p.kind}, ${r.p.confidence} confidence. ` +
      `${Number(r.hits).toLocaleString()} occurrence(s) in ${Number(r.sessions).toLocaleString()} session(s).`;
    host.append(el("p", "muted", "loading…"));
    try {
      const rows = await query(wherePlaced, { val: r.val });
      host.textContent = "";
      const head = el("p", "muted");
      head.append(document.createTextNode("Value "), valueCell(r),
                  document.createTextNode(` · regex ${r.p.regex}`));
      host.append(head);
      const box = el("div", "scroll");
      box.append(tableNode([
        { h: "when", v: r => r.ts.slice(0, 19) },
        { h: "tool", v: r => r.tool || r.method || "—" },
        { h: "session", v: r => r.sid ? r.sid.slice(0, 8) : "—" },
        { h: "surrounding text", v: r => revealNode(r.context, `•••• ${r.context.length} chars`) },
      ], rows));
      host.append(box);
      if (!rows.length) host.append(el("p", "muted", "No message contains this value any more."));
    } catch (e) {
      host.textContent = "";
      host.append(el("p", "err", e.message));
    }
  }

  function notes() {
    const n = $("notes");
    n.textContent = "";
    n.append(notesNode([
      `Patterns come from ${DB._source} (${DB._license}). ${DB.upstream_count} upstream rules; ` +
      `${DB.patterns.length} are usable here. ${DB.dropped_expensive.length} were dropped because ` +
      `ClickHouse rejects them as too slow for vectorscan, and ${DB.dropped_invalid.length} would not compile.`,
      `The secret/identifier label is added by update-secret-patterns.py, not by upstream. Upstream ` +
      `confidence rates match certainty, not sensitivity — an AWS ARN rates high and is not a credential. ` +
      `Ambiguous rules are labelled secret, so a Slack webhook URL counts as one even though it is a URL.`,
      `Every match is a candidate, not a finding. Regex detection has no way to tell a live key from an ` +
      `example in documentation, and short high-entropy rules match ordinary text.`,
      `Some upstream rules match the name of a credential, not the credential — github_token is ` +
      `github[_-]?token(=| =|:| :), so its "value" is the assignment itself and the token is whatever ` +
      `follows. That is why the drill-in carries ${CONTEXT_LEN} characters of surrounding text.`,
      `Two filters cut the promises from the secrets, and both are listed under the table rather than ` +
      `dropped. "No credential material" means the match holds no 16-character run that mixes digits ` +
      `with letters or reads as long hex or base64 — a keyword or a variable name. "git SHA" means a ` +
      `bare 40 hex with no credential word beside it: identical in shape to a pre-ghp_ classic PAT, ` +
      `but in this data it is an Actions pin, a git object, or a version map. A private-key header is ` +
      `never filtered, because there the material is the bytes that follow it.`,
      `Counts are of distinct values, not matches: a token pasted into four hundred shell commands is ` +
      `one secret to rotate. Occurrences count every appearance, so the two numbers differ, and both ` +
      `only see the first ${VALUE_MAX} characters of a match.`,
      `Values arrive masked to a 6-character head and 2-character tail — enough to recognise a false ` +
      `positive, since AKIAIO••••••LE is AWS's documentation key. Reveal shows the full text for one ` +
      `value at a time, on click. The length is always unmasked, because a four-thousand-character ` +
      `"match" is how you spot a greedy rule like AWS ARN, whose regex ends in .+`,
      `The unmasked text is still in the database and in Zed's own history. This page is triage, not containment: ` +
      `if something here is live, rotate it.`,
      `The scan covers the whole recorded JSON-RPC line, so it reaches command lines, tool output, file ` +
      `contents written via Write, prompts and agent replies.`,
      `The tap logs the session you are reading this from, so triaging a secret here records the act of triaging it.`,
    ]));
  }

  async function load() {
    setStatus("loading patterns…");
    try {
      if (!DB) {
        const res = await fetch("secret-patterns.json");
        if (!res.ok) throw new Error(`secret-patterns.json: HTTP ${res.status} — run update-secret-patterns.py`);
        DB = await res.json();
      }
      ACTIVE = selectPatterns();
      if (!ACTIVE.length) {
        setStatus("no patterns match that filter", true);
        return;
      }
      setStatus(`scanning with ${ACTIVE.length.toLocaleString()} patterns…`);
      DATA = await query(hitsQuery(ACTIVE));
      // Extraction only runs for patterns that actually matched, which keeps the unrolled
      // regex list at a couple of dozen rather than the full active set.
      const matched = DATA.map(r => ACTIVE[Number(r.idx) - 1]).filter(Boolean);
      if (matched.length) setStatus(`extracting values from ${matched.length} matched pattern(s)…`);
      VALUES = (matched.length ? await query(valuesQuery(matched)) : [])
        .map(r => ({ ...r, p: matched[Number(r.idx) - 1] })).filter(r => r.p);
      picked = null;
      paint();
      notes();
      setStatus(`${VALUES.length.toLocaleString()} distinct value(s) from ${DATA.length} pattern(s)`);
    } catch (e) {
      setStatus(e.message, true);
    }
  }

  mountHeader({
    current: "secrets.html",
    extraHTML: `
      <label>rated
        <select id="f-kind">
          <option value="secret" selected>secret</option>
          <option value="identifier">identifier</option>
          <option value="all">all</option>
        </select>
      </label>
      <label>confidence
        <select id="f-conf">
          <option value="high" selected>high</option>
          <option value="low">low</option>
          <option value="all">all</option>
        </select>
      </label>`,
    onReload: load,
  });
  for (const id of ["f-kind", "f-conf"]) $(id).onchange = load;
  load();
</script>
