services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3080:8080"
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?required}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text-v2-moe
      - VECTOR_DB=elasticsearch
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:?required}
    volumes:
      - ~/.local-ai/open-webui:/app/backend/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:26.7.5.10
    container_name: clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_USER=acp
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?required}
    volumes:
      - ~/.local-ai/clickhouse:/var/lib/clickhouse
      - ./clickhouse-init.sql:/docker-entrypoint-initdb.d/acp.sql:ro
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  acp-ui:
    image: cgr.dev/chainguard/nginx:latest
    container_name: acp-ui
    restart: unless-stopped
    volumes:
      - ./acp-ui:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8081:8080"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?required}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - ~/.local-ai/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qv ''"status":"red"''',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
