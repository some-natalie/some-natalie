# Serves acp-ui. Identical to the image's stock config apart from the no-cache rule below.
#
# These pages are edited in place and reloaded, and the stock config sends ETag and Last-Modified
# but no Cache-Control. A browser with no Cache-Control caches heuristically and will not
# revalidate, so an edited app.js keeps running from cache — which shows up as functions the page
# calls being undefined, because the HTML is fresh and its script is not.
#
# no-cache does not mean "do not store": the browser still caches and still gets a 304 when
# nothing changed, it just has to ask first. That is the right trade for a local dev UI.
server {
    listen       8080;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        add_header Cache-Control "no-cache";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
