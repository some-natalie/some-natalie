<!doctype html>
<meta charset="utf-8">
<title>acp · bash</title>
<link rel="stylesheet" href="app.css">
<style>
  /* Dashboard kit (cards, tiles, donut, line, heatmap, tables, tooltip) lives in app.css. */
  main { padding: 16px; display: grid; gap: 16px }
  code { font: inherit; color: var(--tool) }
</style>

<header></header>
<main>
  <section class="card"><div class="kpis" id="kpis"></div></section>
  <section class="card">
    <h2>How long calls take, and what they read back</h2>
    <p class="sub" id="sub-dist"></p>
    <div id="c-dist"></div>
  </section>
  <section class="card">
    <h2>Context spend per day</h2>
    <p class="sub" id="sub-spend"></p>
    <div id="c-spend"></div>
  </section>
  <section class="card">
    <h2>Programs the shell invokes</h2>
    <p class="sub" id="sub-progs"></p>
    <div id="c-progs"></div>
  </section>
  <section class="card">
    <h2>Notable calls</h2>
    <p class="sub" id="sub-notable"></p>
    <div id="c-notable"></div>
  </section>
</main>
<footer id="notes"></footer>

<script src="app.js"></script>
<script>
  // Shell calls from the Langfuse trace tables. Three things worth knowing:
  //
  //   * A shell call is any tool event whose input carries a command. NOT a name match: 5,032 of
  //     these have a name that is the command itself ("cd", "export", "grep"), so filtering on
  //     name IN ('Bash','Terminal') loses a quarter of them. See app.js.
  //   * Duration is end_time - start_time directly. Langfuse writes one span per call with both
  //     ends on it, so there is no first-terminal-row logic and no replay to defend against.
  //   * Output size is output_length, a column, rather than the length of a JSON field.
  //
  // Programs are collected cumulatively: one call credits every distinct program it runs, so
  // `sleep 30 && python3 -c '...'` counts under both sleep and python3.
  //
  // Order matters, and each step exists because of a specific wrong answer. Splitting the raw
  // text walks into quoted bodies and reports programs named "print", "select" and "password",
  // so quoted spans are blanked first. Then whole VAR=value pairs go, or the value heads the
  // segment and you get a program called "github.example.com". The value class stops at $( so
  // PW=$(rg ...) still credits rg.
  //
  // Backslashes are doubled and quotes escaped because this lands inside a ClickHouse
  // single-quoted string literal, which unescapes once before RE2 ever sees it. The backtick is
  // \\x60 because a literal one cannot appear in a JS template literal.
  const HEREDOC = String.raw`<<[\\s\\S]*`;
  const QUOTED = String.raw`\'[^\']*\'|"[^"]*"`;
  const ASSIGN = String.raw`(^|[\\s;&|(])[A-Za-z_][A-Za-z0-9_]*=[^\\s;&|$(]*`;
  const SPLIT = String.raw`[\n;|&]+|\\$\\(|\\x60|\\(`;
  const HEAD = String.raw`^(?:(?:cd\\s+[^\\s]+|export|[A-Za-z_][A-Za-z0-9_]*\\(\\)|[{}])\\s+)*([A-Za-z0-9_./-]+)`;
  // Shell syntax and wrappers that are never the interesting program.
  const NOISE = `'if','then','else','elif','fi','for','while','until','do','done','case','esac','in',
                 'function','select','coproc','export','unset','set','local','return','shift','exit',
                 'eval','trap','break','continue','time','sudo','command'`;

  // Above this a duration is a span left open rather than a slow command. The longest here is
  // ~10.6 hours, which is an unclosed span, not a command — those become unknown, like calls with
  // no end_time, so the worst-case figure and the slowest-calls table describe commands.
  const MAX_SECS = 3600;
  const RATE_MIN_CALLS = 20;  // below this a failure rate is noise, not a signal

  // Ordered buckets, declared once so the SQL and the labels cannot drift apart, and so a bucket
  // with nothing in it still renders as an empty row instead of vanishing from the distribution.
  const DUR_BUCKETS = [
    { label: "under 1s", max: 1 }, { label: "1 – 3s", max: 3 }, { label: "3 – 10s", max: 10 },
    { label: "10 – 30s", max: 30 }, { label: "30s – 2m", max: 120 },
    { label: "2 – 10m", max: 600 }, { label: "over 10m", max: Infinity },
  ];
  const OUT_BUCKETS = [
    { label: "empty", max: 1 }, { label: "under 512 B", max: 512 },
    { label: "512 B – 4 KB", max: 4096 }, { label: "4 – 32 KB", max: 32768 },
    { label: "over 32 KB", max: Infinity },
  ];
  const bucketSQL = (col, buckets) =>
    "multiIf(" + buckets.slice(0, -1).map(b => `${col} < ${b.max}, '${b.label}'`).join(", ") +
    `, '${buckets.at(-1).label}')`;
  // Rows come back only for buckets that matched, so fill the gaps against the declared order.
  const fillBuckets = (buckets, rows, keys) => buckets.map(b => {
    const hit = rows.find(r => r.bucket === b.label);
    return Object.fromEntries([["bucket", b.label],
      ...keys.map(k => [k, hit ? Number(hit[k]) : 0])]);
  });

  // Both eras of shell call, unioned. Until 2026-09-18 each was its own TOOL span; since litellm
  // became the path, a shell call is a row in a GENERATION span's tool_calls array (see
  // lfGenCalls in app.js). The command text is present in both, so the program analysis — which is
  // what this page is for — spans the whole history.
  //
  // What the litellm era cannot supply, because litellm sees the request and never the run:
  // secs, out_len, failed. All three are Nullable here rather than 0, so an unmeasured call is
  // excluded from a median instead of dragging it toward zero, and `countIf(failed = 1)` cannot
  // read "not recorded" as "succeeded". `descr` is the exception — the model writes it when it
  // asks, so it survives the join.
  const SHELL = String.raw`
    WITH raw_calls AS (
      SELECT trace_id AS tid, span_id, start_time AS started,
             JSONExtractString(input, 'command') AS cmd,
             JSONExtractString(input, 'description') AS descr,
             toNullable(toUInt8(${LF_FAILED})) AS fail_flag,
             ${LF_STATUS} AS status,
             toNullable(output_length) AS out_len,
             service_name AS svc, 'tool span' AS era,
             if(end_time IS NULL, NULL, ${LF_SECS}) AS secs_raw
      FROM ${LF_TABLE}
      ${LF_PREWHERE}
      WHERE ${LF_SHELL} AND JSONExtractString(input, 'command') != ''
    ),
    gen_calls AS (
      SELECT tid, span_id, started,
             JSONExtractString(args, 'command') AS cmd,
             JSONExtractString(args, 'description') AS descr,
             CAST(NULL, 'Nullable(UInt8)') AS fail_flag,
             '' AS status,
             CAST(NULL, 'Nullable(UInt64)') AS out_len,
             svc, 'model turn' AS era,
             CAST(NULL, 'Nullable(Float64)') AS secs_raw
      FROM (${lfGenSelect()})
      WHERE ${LF_GEN_SHELL} AND JSONExtractString(args, 'command') != ''
    ),
    all_calls AS (SELECT * FROM raw_calls UNION ALL SELECT * FROM gen_calls),
    calls AS (
      SELECT *,
             if(secs_raw <= ${MAX_SECS}, secs_raw, NULL) AS secs,
             replaceAll(replaceAll(cmd, '\n', ' ⏎ '), '\t', ' ') AS oneline,
             arrayDistinct(arrayFilter(x -> x != '' AND x NOT LIKE '-%' AND NOT match(x, '^[0-9]')
                 AND x NOT IN (${NOISE}),
               arrayMap(seg -> arrayElement(splitByChar('/',
                   extract(trimBoth(seg), '${HEAD}')), -1),
                 splitByRegexp('${SPLIT}',
                   replaceRegexpAll(
                     replaceRegexpAll(replaceRegexpOne(cmd, '${HEREDOC}', ''), '${QUOTED}', ' '),
                     '${ASSIGN}', '\\1 '))))) AS progs
      FROM all_calls
    )`;

  const Q = {
    totals: `${SHELL}
      -- No arrayJoin here: it would expand rows and inflate every other aggregate.
      -- The distinct-program count comes from the byProg row count instead.
      SELECT count() AS calls, uniqExact(tid) AS traces, countIf(fail_flag = 1) AS failed,
             count(fail_flag) AS rated,
             countIf(status IN ('pending','in_progress')) AS unfinished, count(secs) AS timed,
             countIf(secs_raw > ${MAX_SECS}) AS overlong,
             round(avg(length(progs)), 1) AS avg_progs,
             round(median(secs), 1) AS p50, round(quantile(0.95)(secs), 1) AS p95,
             round(max(secs), 1) AS worst, sum(out_len) AS out_total, max(out_len) AS out_max,
             count(out_len) AS sized,
             min(started) AS from_ts, max(started) AS to_ts
      FROM calls`,
    byProg: `${SHELL}
      SELECT prog, count() AS calls, countIf(fail_flag = 1) AS failed, count(fail_flag) AS rated,
             round(median(secs), 1) AS p50, round(median(out_len)) AS out_med,
             count(secs) AS timed, count(out_len) AS sized,
             argMax(descr, length(descr)) AS intent
      FROM calls ARRAY JOIN progs AS prog
      GROUP BY prog ORDER BY calls DESC`,
    durations: `${SHELL}
      SELECT ${bucketSQL("secs", DUR_BUCKETS)} AS bucket, count() AS calls
      FROM calls WHERE secs IS NOT NULL GROUP BY bucket`,
    // Bytes as well as calls: the two answer different questions and they disagree sharply here.
    outputs: `${SHELL}
      SELECT ${bucketSQL("out_len", OUT_BUCKETS)} AS bucket, count() AS calls, sum(out_len) AS bytes
      FROM calls WHERE out_len IS NOT NULL GROUP BY bucket`,
    // Calls always; bytes only from the era that records them, so the spend line breaks rather
    // than flatlining to zero over the litellm range.
    perDay: `${SHELL}
      SELECT toDate(started) AS day, sum(out_len) AS bytes, count() AS calls,
             count(out_len) AS sized
      FROM calls GROUP BY day ORDER BY day
      WITH FILL FROM assumeNotNull((SELECT toDate(min(started)) FROM calls)) TO today() + 1 STEP 1`,
  };

  // The three views were three cards with the same columns and no rows in common — the top
  // slowest, largest and failed calls are entirely different calls. So they become one card with
  // a selector: same shape of question, and switching is a comparison rather than a re-sort.
  //
  // All three can only draw on the tool-span era, and their WHERE clauses say so implicitly: a
  // litellm call has NULL secs, NULL out_len and NULL failed, so it matches none of them. The
  // notes make that explicit rather than leaving the reader to wonder where this week went.
  const NOTABLE = [
    { key: "slowest", label: "slowest", where: "secs IS NOT NULL", order: "secs DESC", limit: 12,
      note: t => `Wall time from the span's start to its end. ` +
                 `${Number(t.timed).toLocaleString()} of ${Number(t.calls).toLocaleString()} ` +
                 `calls have both ends recorded — only the tool-span era does.` },
    { key: "biggest", label: "largest output", where: "out_len > 0", order: "out_len DESC", limit: 12,
      note: t => `Bytes of stdout the agent read back, largest first. This is context spend, and ` +
                 `it is knowable for the ${Number(t.sized).toLocaleString()} calls whose span ` +
                 `recorded an output size.` },
    { key: "failures", label: "failures", where: "fail_flag = 1", order: "started DESC", limit: 25,
      note: t => Number(t.failed)
        ? `${Number(t.failed).toLocaleString()} failed call(s) out of the ` +
          `${Number(t.rated).toLocaleString()} with a recorded outcome, newest first. A failure is ` +
          `the span carrying level=ERROR, not a non-zero exit code — the exit status is not recorded.`
        : `No failed calls recorded.` },
  ];
  const notableQuery = (v) => `${SHELL}
    SELECT started, round(secs, 1) AS secs, out_len, arrayStringConcat(progs, ' ') AS progs,
           descr, substring(oneline, 1, 120) AS cmd, tid,
           multiIf(fail_flag IS NULL, 'not recorded', fail_flag = 1, 'failed', 'completed') AS outcome
    FROM calls WHERE ${v.where} ORDER BY ${v.order} LIMIT ${v.limit}`;
  Object.assign(Q, Object.fromEntries(NOTABLE.map(v => [v.key, notableQuery(v)])));

  let DATA = null;
  let notableView = NOTABLE[0].key;   // survives a repaint
  let progFilter = "";
  const secsText = (v) => v === null || v === undefined ? "—" : Number(v).toFixed(1) + "s";

  function paint() {
    const { totals, byProg, durations, outputs, perDay } = DATA;
    const t = totals[0];
    const total = Number(t.calls);
    const failed = Number(t.failed);
    // Denominators for the three things only the tool-span era measures. Each figure is a share of
    // the calls that recorded it, not of every call — otherwise every litellm session would make
    // the shell look faster, quieter and more reliable than it is.
    const rated = Number(t.rated);
    const timed = Number(t.timed);
    const sized = Number(t.sized);
    const failRate = failed / Math.max(rated, 1);
    const unmeasured = total - rated;

    const k = $("kpis");
    k.textContent = "";
    k.append(
      tileNode({ label: "Shell calls", value: total.toLocaleString(), hero: true,
                 foot: `${t.from_ts.slice(0, 10)} → ${t.to_ts.slice(0, 10)}` }),
      tileNode({ label: "Distinct programs", value: byProg.length.toLocaleString(),
                 foot: `${t.avg_progs} per call` +
                       (byProg[0] ? ` · ${byProg[0].prog} in ${(byProg[0].calls / total * 100).toFixed(0)}%` : "") }),
      tileNode({ label: "Median duration", value: secsText(t.p50),
                 foot: `p95 ${secsText(t.p95)} · worst ${secsText(t.worst)}` +
                       (Number(t.overlong) ? ` · ${t.overlong} over ${MAX_SECS / 3600}h discarded` : "") +
                       ` · over ${compact(timed)} timed calls` }),
      tileNode({ label: "Output read back", value: bytes(t.out_total),
                 foot: `largest single call ${bytes(t.out_max)} · over ${compact(sized)} measured calls` }),
      tileNode({ label: "Failed", value: failed ? `✕ ${failed.toLocaleString()}` : "0",
                 foot: `${(failRate * 100).toFixed(1)}% of the ${compact(rated)} calls with an outcome` }),
    );
    if (failed) k.querySelector(".tile:nth-child(5) .value").classList.add("fail");

    // Two distributions side by side. Both are ordinal, so the bars carry the shape and the
    // numbers stay exact — the point of each is a comparison the KPI tiles cannot show:
    // most calls finish in seconds, and most bytes arrive in the calls that are not most calls.
    const dur = fillBuckets(DUR_BUCKETS, durations, ["calls"]);
    const out = fillBuckets(OUT_BUCKETS, outputs, ["calls", "bytes"]);
    const durMax = Math.max(...dur.map(r => r.calls), 1);
    const byteMax = Math.max(...out.map(r => r.bytes), 1);
    const quick = dur.slice(0, 3).reduce((a, r) => a + r.calls, 0);
    const heavy = out.slice(-2).reduce((a, r) => ({ c: a.c + r.calls, b: a.b + r.bytes }), { c: 0, b: 0 });
    const totalBytes = out.reduce((a, r) => a + r.bytes, 0) || 1;

    // Shares against `timed` and `sized`, the calls each distribution actually contains — not
    // against every call, which would report the litellm era as a bucket that is missing.
    $("sub-dist").textContent =
      `${(quick / Math.max(timed, 1) * 100).toFixed(0)}% of the ${timed.toLocaleString()} timed calls ` +
      `finish in under ten seconds. Output is the mirror image: the ` +
      `${(heavy.c / Math.max(sized, 1) * 100).toFixed(0)}% of measured calls above 4 KB carry ` +
      `${(heavy.b / totalBytes * 100).toFixed(0)}% of the bytes, which is the context they spend.` +
      (unmeasured > 0
        ? ` Both cover the ${compact(rated)} calls written as their own tool span; the ` +
          `${compact(unmeasured)} calls since litellm took over carry a command but no timing or ` +
          `output size, so they are absent from both distributions rather than sitting in a zero bucket.`
        : "");
    const dhost = $("c-dist");
    dhost.textContent = "";
    const dsplit = el("div", "split even");
    dsplit.append(
      (() => {
        const wrap = el("div");
        wrap.append(el("div", "colcap", "call duration"));
        // Percentages summing to 100, not px: under fixed layout Chrome scales specified widths
        // proportionally when they under-fill the table, which starves the one auto column.
        const tb = tableNode([
          { h: "", w: "22%", v: r => r.bucket },
          { h: "", w: "46%", cls: () => "bar", v: r => barCell(r.calls / durMax) },
          { h: "calls", w: "16%", n: true, v: r => r.calls.toLocaleString() },
          { h: "share", w: "16%", n: true,
            v: r => (r.calls / Math.max(timed, 1) * 100).toFixed(1) + "%" },
        ], dur);
        tb.classList.add("fixed");
        wrap.append(tb);
        return wrap;
      })(),
      (() => {
        const wrap = el("div");
        wrap.append(el("div", "colcap", "output read back — bar is bytes, not calls"));
        const tb = tableNode([
          { h: "", w: "26%", v: r => r.bucket },
          { h: "", w: "40%", cls: () => "bar", v: r => barCell(r.bytes / byteMax) },
          { h: "bytes", w: "17%", n: true, v: r => bytes(r.bytes) },
          { h: "calls", w: "17%", n: true, v: r => r.calls.toLocaleString() },
        ], out);
        tb.classList.add("fixed");
        wrap.append(tb);
        return wrap;
      })(),
    );
    dhost.append(dsplit);

    // Bytes, not calls: the KPI gives a total with no trend, and what matters about output is how
    // much context it costs, which a call count does not tell you.
    //
    // A day with calls but no recorded output size is null, not zero — Number(null) is 0, which
    // would draw the litellm era as a run of days that read nothing back. Measured days only, for
    // the mean as well as the line, so the average is not divided by days it has no data for.
    const measured = perDay.filter(r => Number(r.sized));
    const spendTotal = measured.reduce((a, r) => a + Number(r.bytes), 0);
    const busiest = measured.reduce((a, r) => Number(r.bytes) > Number(a.bytes) ? r : a,
                                   measured[0] ?? perDay[0]);
    const goneQuiet = perDay.filter(r => Number(r.calls) && !Number(r.sized)).length;
    $("sub-spend").textContent =
      `Bytes of stdout read back per day. Heaviest was ` +
      `${busiest.day} at ${bytes(busiest.bytes)}, against a daily mean of ` +
      `${bytes(spendTotal / Math.max(measured.length, 1))} over the ${measured.length} days that ` +
      `record output sizes.` +
      (goneQuiet
        ? ` The line stops where the tool spans do: ${goneQuiet} later day(s) still have shell ` +
          `calls, but litellm does not record what they read back, so the series breaks rather ` +
          `than reporting zero bytes.`
        : "");
    render("c-spend",
      host => lineChart(host, perDay, {
        x: r => r.day,
        yFmt: bytes,
        series: [{ name: "output", value: r => Number(r.sized) ? Number(r.bytes) : null,
                   color: "var(--viz-series)", area: true }],
        tipText: r => `${r.day}\n` +
                      (Number(r.sized) ? `${bytes(r.bytes)} read back\n` : `output size not recorded\n`) +
                      `${Number(r.calls).toLocaleString()} call(s)`,
      }),
      () => tableNode([
        { h: "day", v: r => r.day },
        { h: "output", n: true, v: r => Number(r.sized) ? bytes(r.bytes) : "—" },
        { h: "calls", n: true, v: r => Number(r.calls).toLocaleString() },
      ], perDay));

    // One table with an inline bar rather than a chart plus a table behind a toggle. Hundreds of
    // programs is far past the count any chart reads well at, and the tail is nearly weightless,
    // so the useful thing is every row reachable with the exact numbers beside it.
    //
    // Bars are relative to the busiest program, not to the call total: a call credits every
    // program it runs, so the counts deliberately sum past 100% of calls.
    const maxCalls = Math.max(...byProg.map(r => Number(r.calls)), 1);
    const phost = $("c-progs");

    // Bars stay relative to the busiest program overall, not to the filtered set, so filtering
    // narrows the list without silently rescaling every bar under it.
    const drawProgs = () => {
      const q = progFilter.trim().toLowerCase();
      const shown = q ? byProg.filter(r => r.prog.toLowerCase().includes(q)) : byProg;
      $("sub-progs").textContent =
        (q ? `${shown.length} of ${byProg.length} programs match "${progFilter.trim()}". `
           : `${byProg.length} distinct programs across ${total.toLocaleString()} calls, ` +
             `${t.avg_progs} per call, busiest first. `) +
        `Every program a call runs is credited, so a call appears under each one and the shares ` +
        `add up to well over 100% — bar length is relative to ${byProg[0].prog}, the busiest ` +
        `overall, not to a total or to the filtered set.`;
      const old = phost.querySelector(".scroll");
      if (old) old.remove();
      phost.append(buildProgTable(shown));
    };

    const filter = el("div", "filterbar");
    const fin = el("input");
    Object.assign(fin, { type: "search", placeholder: "filter programs…", value: progFilter });
    fin.setAttribute("aria-label", "filter programs");
    fin.oninput = () => { progFilter = fin.value; drawProgs() };
    filter.append(fin);
    phost.textContent = "";
    phost.append(filter);

    function buildProgTable(rows) {
      const box = el("div", "scroll");
      // Widths are pinned left of the intent column so the bar sits against the name it belongs
      // to and the leftover width goes to the one column that can spend it on information. Needs
      // the fixed class: under auto layout these read as suggestions and the name column swallows
      // the slack. px, not ch: these cells are 13px with border-box padding, so a ch estimate
      // has to account for both the smaller em and 16px of padding.
      const progTable = tableNode([
        { h: "program", w: "188px", v: r => r.prog },
        { h: "", w: "170px", cls: () => "bar", v: r => barCell(Number(r.calls) / maxCalls) },
        { h: "calls", w: "72px", n: true, v: r => Number(r.calls).toLocaleString() },
        { h: "share", w: "62px", n: true, v: r => (r.calls / total * 100).toFixed(1) + "%" },
        // These three are medians and counts over the subset of this program's calls that recorded
        // the measure, so a program seen only since litellm shows "—" rather than 0s / 0 B / 0
        // failures, each of which would be a measurement this page never took.
        { h: "median", w: "72px", n: true, v: r => Number(r.timed) ? secsText(r.p50) : "—" },
        { h: "output", w: "78px", n: true, v: r => Number(r.sized) ? bytes(r.out_med) : "—" },
        { h: "failed", w: "66px", n: true,
          v: r => Number(r.rated) ? (Number(r.failed) || "") : "—",
          cls: r => Number(r.failed) ? "fail" : "" },
        // Sorted by volume, the unreliable programs never rise to the top — a rate column is what
        // surfaces them. Flagged at twice the page-wide rate, so the threshold moves with the data
        // rather than being baked in, but only past a floor of ${RATE_MIN_CALLS} calls with a
        // recorded outcome: one failure out of three is 33% and means nothing.
        { h: "fail rate", w: "76px", n: true,
          v: r => Number(r.rated) ? (r.failed / r.rated * 100).toFixed(1) + "%" : "—",
          cls: r => Number(r.rated) >= RATE_MIN_CALLS && r.failed / r.rated >= 2 * failRate
            ? "fail" : "" },
        { h: "example intent", v: r => r.intent || "—" },
      ], rows);
      progTable.classList.add("fixed");
      box.append(progTable);
      return box;
    }
    drawProgs();

    const nhost = $("c-notable");
    const drawNotable = () => {
      const v = NOTABLE.find(x => x.key === notableView);
      const rows = DATA[v.key];
      $("sub-notable").textContent = v.note(t);
      const old = nhost.querySelector("table, .muted");
      if (old) old.remove();
      // The sorted-on column leads, so whichever view you pick reads top-down by its own measure.
      // bytesText/secsText both print "—" for a null, which every row in these three views has for
      // at most one column: all three filter to the tool-span era by construction.
      const bytesText = (v2) => v2 === null || v2 === undefined ? "—" : bytes(v2);
      const lead = v.key === "biggest"
        ? { h: "output", n: true, v: r => bytesText(r.out_len) }
        : v.key === "failures"
          ? { h: "when", v: r => r.started.slice(5, 16) }
          : { h: "secs", n: true, v: r => secsText(r.secs) };
      nhost.append(rows.length
        ? tableNode([
            lead,
            { h: "intent", v: r => r.descr || "—" },
            { h: "programs", v: r => r.progs },
            ...(v.key === "biggest" ? [{ h: "secs", n: true, v: r => secsText(r.secs) }]
                                    : [{ h: "output", n: true, v: r => bytesText(r.out_len) }]),
            ...(v.key === "failures" ? []
                : [{ h: "outcome", v: r => r.outcome,
                     cls: r => r.outcome === "failed" ? "fail" : "" }]),
            { h: "trace", v: r => lfTrace(r.tid) },
            { h: "command", v: r => r.cmd, cls: () => "wrap" },
          ], rows)
        : el("p", "muted", "Nothing to show."));
    };

    nhost.textContent = "";
    const picker = el("div", "filterbar");
    const sel = el("select");
    for (const v of NOTABLE) {
      const o = el("option", null, v.label);
      o.value = v.key;
      if (v.key === notableView) o.selected = true;
      sel.append(o);
    }
    sel.setAttribute("aria-label", "which notable calls");
    sel.onchange = () => { notableView = sel.value; drawNotable() };
    picker.append(el("span", "muted", "show"), sel);
    nhost.append(picker);
    drawNotable();

    const notes = $("notes");
    notes.textContent = "";
    notes.append(notesNode([
      `Two sources, unioned. Until 2026-09-18 every shell call was its own TOOL span written by the zed-acp tap, carrying duration, output size and outcome. Since litellm became the path, a shell call is a row in the tool_calls array of the GENERATION span for the model turn that asked for it. Both carry the command text, so the program analysis covers the whole history.`,
      `The litellm era records the request, not the run: it has the command and often the model's stated intent, but no duration, no output size and no outcome, because litellm never sees the tool execute. Of ${Number(t.calls).toLocaleString()} shell calls, ${Number(t.rated).toLocaleString()} record an outcome and ${Number(t.sized).toLocaleString()} an output size. Every median, share and rate on this page is against the subset that recorded the measure, and a "—" means unmeasured rather than zero.`,
      `A shell call is any event whose payload carries a command — that is the test, not the event name. On TOOL spans, Langfuse's name field is the command itself on 5,032 rows (cd, export, grep, "git push 2>&1 | tail -2"), so matching on Bash or Terminal by name would drop a quarter of them; on litellm rows the name is "litellm_request" on every one, so the payload is the only test that works for both.`,
      `One row is one call. Langfuse writes each span once with both timestamps on it, so there is no replay to defend against and no need to hunt for a call's first terminal row — the duration is simply end minus start.`,
      `Programs are read off the command text cumulatively: quoted spans and heredoc bodies are blanked, VAR=value pairs dropped, then the remainder is split on ; && || | $( and newlines and the head of each piece is taken. A call is credited once per distinct program, so per-program counts overlap and do not sum to the call total.`,
      `Because quoted spans are blanked, an interpreter's payload is not inspected: python3 -c '...' counts as python3, and whatever it runs inside is invisible here.`,
      `Median duration and output are per call involving that program, not per program — a slow call with six programs is counted slow under all six.`,
      Number(t.rated) - Number(t.timed) > 0
        ? `${(Number(t.rated) - Number(t.timed)).toLocaleString()} call(s) from the tool-span era have no usable duration: either the span has no end time or it exceeded ${MAX_SECS / 3600}h, which is a span left open rather than a slow command.`
        : "",
      `Output size is output_length, the bytes of stdout the agent read back. There is no exit code in the trace, so "failed" means the span carried level=ERROR.`,
      out.at(-1).calls === 0
        ? `Nothing lands in the largest output bucket: shell output here tops out near 30 KB, while other tool spans in the same table reach 640 KB. The bucket is kept so the scale does not silently change shape when a bigger call does arrive.`
        : "",
      `This traces the sessions you run through Zed and litellm, so a live session inflates its own numbers.`,
    ]));
  }

  async function load() {
    setStatus("loading…");
    try {
      const keys = ["totals", "byProg", "durations", "outputs", "perDay",
                    ...NOTABLE.map(v => v.key)];
      const rows = await Promise.all(keys.map(k => query(Q[k])));
      DATA = Object.fromEntries(keys.map((k, i) => [k, rows[i]]));
      if (!DATA.totals.length || !Number(DATA.totals[0].calls)) {
        setStatus("no shell calls recorded yet");
        $("kpis").textContent = "";
        return;
      }
      paint();
      setStatus(`${Number(DATA.totals[0].calls).toLocaleString()} shell calls · ` +
                `${DATA.byProg.length} programs`);
    } catch (e) {
      setStatus(e.message, true);
    }
  }

  mountHeader({
    current: "bash.html",
    onReload: load,
    onToggleView: () => { if (DATA) paint() },
  });
  load();
</script>
