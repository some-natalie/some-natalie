<!doctype html>
<meta charset="utf-8">
<title>acp · files</title>
<link rel="stylesheet" href="app.css">
<style>
  /* Dashboard kit (cards, tiles, donut, line, heatmap, tables, tooltip) lives in app.css. */
  main { padding: 16px; display: grid; gap: 16px }
</style>

<header></header>
<main>
  <section class="card"><div class="kpis" id="kpis"></div></section>
  <section class="card">
    <h2>File types</h2>
    <p class="sub" id="sub-types"></p>
    <div id="c-types"></div>
  </section>
  <section class="card">
    <h2>Where the work happened</h2>
    <p class="sub" id="sub-proj"></p>
    <div id="c-proj"></div>
  </section>
  <section class="card">
    <h2>Most-touched files</h2>
    <p class="sub" id="sub-files"></p>
    <div id="c-files"></div>
  </section>
</main>
<footer id="notes"></footer>

<script src="app.js"></script>
<script>
  // File operations from the Langfuse trace tables. Read, Edit and Write all put the target in
  // input.file_path, so the presence of that key is what identifies a file operation — not the
  // event name, which carries the path appended to it on thousands of rows ("Edit
  // some-natalie/.../app.css" is 5,854 distinct names, see app.js).
  //
  // No replay dedup: Langfuse writes each span once, so one row is one operation. That removes
  // any need to collapse several rows per call into one.
  //
  // Type is the last dot-separated component of the basename. A file with no extension is shown
  // under its own name (Dockerfile, acp-tap) rather than lumped into a bucket, and a pure dotfile
  // (.env) keeps its leading dot.
  //
  // HOME is discovered from the data rather than hardcoded, so this page carries no username and
  // works on any machine. The traced paths are absolute, so the common prefix of every
  // /Users/<name>/ or /home/<name>/ path IS the home directory; homeQuery() below asks ClickHouse
  // for the most frequent one. Set HOME_OVERRIDE if you trace more than one user's paths into the
  // same table and want to pin which one is "~".
  //
  // ROOTS are the directories whose immediate subdirectories count as projects. Relative to home,
  // so they travel: add one and it becomes a project source. A checkout under no listed root falls
  // into (elsewhere) rather than being counted as itself.
  const HOME_OVERRIDE = "";
  const ROOT_NAMES = ["Code", "xfer"];

  let HOME = HOME_OVERRIDE;
  let ROOTS = [];

  // The home prefix, taken from the paths themselves: /Users/x/ on macOS, /home/x/ on linux.
  // Ordered by frequency so a stray path from another machine cannot win.
  const homeQuery = () => `
    SELECT concat(arrayElement(parts, 1), '/', arrayElement(parts, 2), '/',
                  arrayElement(parts, 3), '/') AS home, count() AS n
    FROM (
      SELECT splitByChar('/', JSONExtractString(input, 'file_path')) AS parts
      FROM ${LF_TABLE}
      ${LF_PREWHERE}
      WHERE ${LF_FILE}
        AND match(JSONExtractString(input, 'file_path'), '^/(Users|home)/[^/]+/')
      UNION ALL
      SELECT splitByChar('/', ${LF_GEN_PATH}) AS parts
      FROM (${lfGenSelect()})
      WHERE ${LF_GEN_FILE} AND match(${LF_GEN_PATH}, '^/(Users|home)/[^/]+/')
    )
    GROUP BY home ORDER BY n DESC LIMIT 1`;

  // Project comes from string functions rather than extract(path, '/Code/([^/]+)'): that regex is
  // unanchored, so any path with a /Code/ segment anywhere matches, and it captures a bare
  // filename when a file sits directly in a root. Requiring a following slash makes it a directory.
  const PROJECT = `
    multiIf(root != '' AND position(rest, '/') > 0,
              substring(rest, 1, position(rest, '/') - 1),
            root != '', '(loose files)',
            position(path, '/.claude/') > 0, '(claude config)',
            '(elsewhere)')`;

  // The tool is the first token of the name, which recovers Read/Edit/Write even when the path
  // has been appended to it. Anything else carrying a file_path (a rename, a subagent's own
  // wrapper) lands in `other` rather than being silently dropped.
  //
  // Two eras, unioned, for the reason set out in app.js: TOOL spans stop on 2026-09-18 and every
  // file operation since is a row in a GENERATION span's tool_calls array. What this page counts —
  // which files, which projects, which operation — is present in both, so the union is clean. The
  // one column that is not is the outcome, which litellm never sees; `failed` is therefore Nullable
  // and NULL means unrecorded, not succeeded.
  //
  // The litellm era spells the argument two ways: Claude Code sends file_path, Zed's own
  // lowercase read/write/edit tools send path. LF_GEN_PATH takes whichever is there.
  //
  // A function, not a constant: HOME and ROOTS are only known once load() has asked the data for
  // them, so the SQL cannot be built at parse time.
  const FILES = () => `
    WITH t AS (
      SELECT splitByChar(' ', name)[1] AS tool,
             JSONExtractString(input, 'file_path') AS path,
             trace_id AS tid, start_time AS ts,
             toNullable(toUInt8(${LF_FAILED})) AS fail_flag
      FROM ${LF_TABLE}
      ${LF_PREWHERE}
      WHERE ${LF_FILE} AND JSONExtractString(input, 'file_path') != ''
      UNION ALL
      SELECT tool, ${LF_GEN_PATH} AS path, tid, started AS ts,
             CAST(NULL, 'Nullable(UInt8)') AS fail_flag
      FROM (${lfGenSelect()})
      WHERE ${LF_GEN_FILE} AND ${LF_GEN_PATH} != ''
    ),
    f AS (
      SELECT tool, path, tid, ts, fail_flag,
             replaceOne(path, '${chEsc(HOME)}', '~/') AS short,
             arrayElement(splitByChar('/', path), -1) AS base,
             splitByChar('.', arrayElement(splitByChar('/', path), -1)) AS parts,
             -- The root this path lives under, '' if none. arrayFirst keeps the roots a list
             -- rather than a chain of ifs, so adding one is a one-line edit.
             arrayFirst(x -> startsWith(path, x), ${rootsSQL()}) AS root,
             trim(TRAILING '/' FROM replaceOne(root, '${chEsc(HOME)}', '~/')) AS rootname,
             -- length() server-side, not root.length in JS: ClickHouse counts bytes, JS counts
             -- UTF-16 units, and they diverge the moment a home directory is not ASCII.
             substring(path, length(root) + 1) AS rest
      FROM t
    ),
    files AS (
      SELECT *, ${PROJECT} AS project,
             -- Case-folded: Zed's own tools are lowercase (read/write/edit) where Claude Code's
             -- are capitalised, and matching only the capitalised spelling would file every local
             -- model's file operation under "other".
             multiIf(lower(tool) = 'read', 'Read', lower(tool) = 'edit', 'Edit',
                     lower(tool) = 'write', 'Write', 'other') AS op,
             if(length(parts) > 1 AND arrayElement(parts, 1) != '', lower(arrayElement(parts, -1)),
                if(length(parts) > 2, lower(arrayElement(parts, -1)), base)) AS type
      FROM f
    )`;

  // Longest first, so a root nested inside another root wins over its parent.
  const rootsSQL = () => "[" + [...ROOTS].sort((a, b) => b.length - a.length)
    .map(r => `'${chEsc(r)}'`).join(",") + "]";

  const OPS = `countIf(op = 'Read') AS reads, countIf(op = 'Edit') AS edits,
               countIf(op = 'Write') AS writes, countIf(op = 'other') AS others`;
  // Failures, plus how many operations record an outcome at all — only the tool-span era does, so
  // a rate against every touch would fall as litellm writes more and read as things improving.
  const FAILS = `countIf(fail_flag = 1) AS failed, count(fail_flag) AS rated`;

  // Also functions now, for the same reason FILES is.
  const Q = {
    totals: () => `${FILES()}
      SELECT count() AS touches, uniqExact(path) AS files, uniqExact(type) AS types,
             uniqExact(project) AS projects, uniqExact(tid) AS traces, ${FAILS},
             ${OPS}, min(ts) AS from_ts, max(ts) AS to_ts
      FROM files`,
    byType: () => `${FILES()}
      SELECT type, count() AS touches, uniqExact(path) AS files, ${OPS}
      FROM files GROUP BY type ORDER BY touches DESC`,
    byProject: () => `${FILES()}
      SELECT project, count() AS touches, uniqExact(path) AS files,
             uniqExact(type) AS types, max(ts) AS last_ts, ${FAILS},
             arrayStringConcat(arraySort(groupUniqArray(rootname)), ', ') AS roots,
             uniqExact(root) AS nroots
      FROM files GROUP BY project ORDER BY touches DESC`,
    // toMonday so a week is a calendar week, not a rolling 7 days from whenever the data starts.
    byProjectWeek: () => `${FILES()}
      SELECT project, toMonday(toDate(ts)) AS week, count() AS touches
      FROM files GROUP BY project, week`,
    topFiles: () => `${FILES()}
      SELECT short, type, project, count() AS touches, ${OPS}, max(ts) AS last_ts,
             argMax(tid, ts) AS tid
      FROM files GROUP BY short, type, project ORDER BY touches DESC LIMIT 25`,
  };

  let DATA = null;
  const ops = (r) => `${r.reads} read · ${r.edits} edit · ${r.writes} write` +
                     (Number(r.others) ? ` · ${r.others} other` : "");

  function paint() {
    const { totals, byType, byProject, byProjectWeek, topFiles } = DATA;
    const t = totals[0];
    const touches = Number(t.touches);

    const k = $("kpis");
    k.textContent = "";
    k.append(
      tileNode({ label: "Files touched", value: Number(t.files).toLocaleString(), hero: true,
                 foot: `${touches.toLocaleString()} operations · ` +
                       `${t.from_ts.slice(0, 10)} → ${t.to_ts.slice(0, 10)}` }),
      tileNode({ label: "File types", value: Number(t.types).toLocaleString(),
                 foot: byType[0] ? `${byType[0].type} leads at ${(byType[0].touches / touches * 100).toFixed(0)}%` : "" }),
      tileNode({ label: "Edits", value: Number(t.edits).toLocaleString(),
                 foot: `${(t.edits / Math.max(touches, 1) * 100).toFixed(0)}% of operations` }),
      tileNode({ label: "Reads", value: Number(t.reads).toLocaleString(),
                 foot: `${(t.reads / Math.max(touches, 1) * 100).toFixed(0)}% of operations` }),
      tileNode({ label: "Writes", value: Number(t.writes).toLocaleString(),
                 foot: `whole-file creates or rewrites` }),
    );

    // Six segments is the ceiling for a ring, so the top five types get one each and the rest
    // become one slice. The long tail is not a colour problem, it is a table.
    const SLICES = 5;
    const head = byType.slice(0, SLICES);
    const tail = byType.slice(SLICES);
    const sum = (rows, k) => rows.reduce((a, r) => a + Number(r[k]), 0);
    const slices = tail.length
      ? [...head, { type: `other (${tail.length} types)`, touches: sum(tail, "touches"),
                    files: sum(tail, "files"), reads: sum(tail, "reads"),
                    edits: sum(tail, "edits"), writes: sum(tail, "writes"),
                    others: sum(tail, "others") }]
      : head;
    const typeTip = r => `${r.type}\n${Number(r.files).toLocaleString()} file(s) · ` +
                         `${Number(r.touches).toLocaleString()} operations\n${ops(r)}`;

    $("sub-types").textContent =
      `${byType.length} types over ${Number(t.files).toLocaleString()} files, by share of ` +
      `operations. The ring is the top ${SLICES}; every type is in the table. Hover either for ` +
      `the read/edit/write split.`;
    const host = $("c-types");
    host.textContent = "";
    const split = el("div", "split");
    split.append(
      donut(slices, {
        label: r => r.type, value: r => Number(r.touches), tipText: typeTip,
        centre: compact(touches), centreFoot: "operations",
      }),
      (() => {
        const box = el("div", "scroll");
        const rank = new Map(head.map((r, i) => [r.type, i]));
        box.append(tableNode([
          // The swatch ties a row to its slice; tail rows carry the "other" colour, which is the
          // slot right after the head rather than a fixed index.
          { h: "", v: r => {
              const sw = el("i", "sw");
              sw.style.background = CAT[rank.has(r.type) ? rank.get(r.type) : head.length];
              return sw;
            } },
          { h: "type", v: r => r.type },
          { h: "files", n: true, v: r => Number(r.files).toLocaleString() },
          { h: "operations", n: true, v: r => Number(r.touches).toLocaleString() },
          { h: "share", n: true, v: r => (r.touches / touches * 100).toFixed(1) + "%" },
          { h: "read", n: true, v: r => Number(r.reads) || "" },
          { h: "edit", n: true, v: r => Number(r.edits) || "" },
          { h: "write", n: true, v: r => Number(r.writes) || "" },
        ], byType));
        return box;
      })(),
    );
    host.append(split);

    // A bar per project throws away the more interesting half of "where": one project can run for
    // eleven weeks while several are a single afternoon, and only a time axis shows that.
    const weeks = [...new Set(byProjectWeek.map(r => r.week))].sort();
    const cell = new Map(byProjectWeek.map(r => [`${r.project}|${r.week}`, Number(r.touches)]));
    const activeWeeks = r => weeks.filter(w => cell.get(`${r.project}|${w}`)).length;

    const rootList = ROOTS.map(r => r.replace(HOME, "~/")).join(" and ");
    const spans = byProject.filter(r => Number(r.nroots) > 1);
    $("sub-proj").textContent =
      `Grouped by the directory under ${rootList}, one row per project and one column per ` +
      `calendar week, shaded by operations. A file sitting directly in a root is (loose files); ` +
      `outside them, (claude config) is agent memory and settings and (elsewhere) is /tmp and ` +
      `the like.` +
      (spans.length ? ` ${spans.length} project(s) appear under more than one root and are ` +
                      `counted once — the root column names them.` : "");
    const phost = $("c-proj");
    phost.textContent = "";
    const psplit = el("div", "split wide");
    psplit.append(
      heatmap(byProject, {
        cols: weeks,
        row: r => r.project,
        // Label the first column of each month; a date on all of them does not fit.
        colLabel: (w, i) => (i === 0 || w.slice(5, 7) !== weeks[i - 1].slice(5, 7))
          ? MONTHS[Number(w.slice(5, 7)) - 1] : w.slice(8, 10),
        value: (r, w) => cell.get(`${r.project}|${w}`) || 0,
        buckets: [9, 49, 199, 499, Infinity],
        tipText: (r, w, n) => `${r.project}${r.roots ? ` — ${r.roots}` : ""}\nweek of ${w}\n` +
          (n ? `${n.toLocaleString()} operations` : "no activity") +
          `\n\nall time: ${Number(r.touches).toLocaleString()} operations across ` +
          `${activeWeeks(r)} of ${weeks.length} weeks\n` +
          `${Number(r.files).toLocaleString()} file(s) · ${Number(r.types).toLocaleString()} type(s)` +
          (Number(r.nroots) > 1 ? `\n\nsame name under ${r.nroots} roots, counted as one` : ""),
      }),
      (() => {
        const box = el("div", "scroll");
        box.append(tableNode([
          { h: "project", v: r => r.project },
          { h: "root", v: r => r.roots || "—", cls: r => Number(r.nroots) > 1 ? "fail" : "" },
          { h: "files", n: true, v: r => Number(r.files).toLocaleString() },
          { h: "operations", n: true, v: r => Number(r.touches).toLocaleString() },
          { h: "share", n: true, v: r => (r.touches / touches * 100).toFixed(1) + "%" },
          { h: "weeks active", n: true, v: r => `${activeWeeks(r)} of ${weeks.length}` },
          { h: "last touched", v: r => r.last_ts.slice(5, 16) },
        ], byProject));
        return box;
      })(),
    );
    phost.append(psplit);

    $("sub-files").textContent = `Top ${Math.min(25, topFiles.length)} of ` +
      `${Number(t.files).toLocaleString()} files, by number of operations. The trace links to the ` +
      `most recent request that touched the file.`;
    $("c-files").textContent = "";
    $("c-files").append(tableNode([
      { h: "file", v: r => r.short, cls: () => "wrap" },
      { h: "type", v: r => r.type },
      { h: "read", n: true, v: r => Number(r.reads) || "" },
      { h: "edit", n: true, v: r => Number(r.edits) || "" },
      { h: "write", n: true, v: r => Number(r.writes) || "" },
      { h: "total", n: true, v: r => Number(r.touches).toLocaleString() },
      { h: "last touched", v: r => r.last_ts.slice(5, 16) },
      { h: "trace", v: r => lfTrace(r.tid) },
    ], topFiles));

    const notes = $("notes");
    notes.textContent = "";
    notes.append(notesNode([
      `A file operation is any tool event whose input carries a file_path — that is the test, not the event name. Langfuse's name field has the path appended to it on thousands of rows ("Edit some-natalie/.../app.css", 5,854 distinct values), so matching on names would drop most of them. The read/edit/write label is the first token of that name; anything else with a file_path counts as "other".`,
      `Files reached through the shell — cat, sed, grep, redirects — are invisible here, so this undercounts real file activity. The bash page covers that side.`,
      `One row is one operation. Langfuse writes each span once, so there is no replay to de-duplicate.`,
      `Type is the last dot-separated part of the filename, so model.json.example counts as "example" and a log named run.output counts as "output". yml and yaml are kept separate because the filenames differ.`,
      `Files with no extension appear under their own name, which is why Dockerfile and acp-tap show up beside md and html.`,
      `A project is an immediate subdirectory of one of the roots — ${ROOTS.map(r => r.replace(HOME, "~/")).join(", ")}. The home directory is read from the traced paths themselves rather than configured, so this page carries no username; ROOT_NAMES at the top is the list of directories to treat as project sources, and adding one is a one-line edit. A checkout under no listed root falls into (elsewhere) rather than being counted as itself.`,
      `A project name found under two roots is counted once, on the assumption it is the same checkout in two places. The root column lists every root a project was seen under and flags the ones with more than one, so two unrelated directories that happen to share a name do not merge unnoticed.`,
      `A git worktree is its own row rather than folding into the repo it came from: the file path records where the worktree lives, not which repository it belongs to.`,
      `An Edit is one edit call, not one changed line — a file edited in ten passes counts ten times. A Write is a whole-file create or overwrite.`,
      `Two sources, unioned. Until 2026-09-18 each file operation was its own TOOL span; since litellm became the path, it is a row in the tool_calls array of the model turn that requested it. Which file, which project and which operation are recorded in both. The outcome is not: litellm never sees the tool run, so only ${Number(t.rated).toLocaleString()} of ${Number(t.touches).toLocaleString()} operations record whether they succeeded.`,
      `The litellm era spells the path argument two ways — Claude Code sends file_path, Zed's built-in read/write/edit send path — and names its tools in lowercase. Both spellings and both cases are counted, otherwise every local model's file work would vanish or land in "other".`,
      Number(t.failed)
        ? `${Number(t.failed).toLocaleString()} of the ${Number(t.rated).toLocaleString()} operations with a recorded outcome failed (level=ERROR) and are still counted as operations — an attempted edit is still a touch.`
        : "",
    ]));
  }

  async function load() {
    setStatus("loading…");
    try {
      // Resolve the home prefix before building any SQL that references it. Falls back to a
      // prefix that matches nothing, so every path lands in (elsewhere) rather than the page
      // erroring out — which is the right answer for a table of relative or non-home paths.
      if (!HOME) {
        const rows = await query(homeQuery());
        HOME = rows[0]?.home || "/nonexistent/";
      }
      ROOTS = ROOT_NAMES.map(n => `${HOME}${n}/`);

      const [totals, byType, byProject, byProjectWeek, topFiles] = await Promise.all(
        [Q.totals, Q.byType, Q.byProject, Q.byProjectWeek, Q.topFiles].map(q => query(q())));
      if (!totals.length || !Number(totals[0].touches)) {
        setStatus("no file operations recorded yet");
        $("kpis").textContent = "";
        return;
      }
      DATA = { totals, byType, byProject, byProjectWeek, topFiles };
      paint();
      setStatus(`${Number(totals[0].files).toLocaleString()} files · ` +
                `${Number(totals[0].touches).toLocaleString()} operations`);
    } catch (e) {
      setStatus(e.message, true);
    }
  }

  mountHeader({ current: "files.html", onReload: load });
  load();
</script>
