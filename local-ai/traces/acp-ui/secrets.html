<!doctype html>
<meta charset="utf-8">
<title>acp · secrets</title>
<link rel="stylesheet" href="app.css">
<style>
  /* Dashboard kit, the triage styles (reveal, picked row) and the Langfuse link live in app.css. */
  main { padding: 16px; display: grid; gap: 16px }
</style>

<header></header>
<main>
  <section class="card"><div class="kpis" id="kpis"></div></section>
  <section class="card">
    <h2>Distinct values found</h2>
    <p class="sub" id="sub-hits"></p>
    <div id="c-hits"></div>
  </section>
  <section class="card">
    <h2>Where it appeared</h2>
    <p class="sub" id="sub-detail">Pick a value above to see every event it turned up in.</p>
    <div id="c-detail"></div>
  </section>
</main>
<footer id="notes"></footer>

<script src="app.js"></script>
<script>
  // Same scan as secrets.html, pointed at Langfuse instead of the ACP wire. The scan, the noise
  // heuristics and the masking are shared from app.js so a rule only changes in one place.
  //
  // Langfuse 4.x stores spans in events_full, not the traces/observations tables — those exist
  // and are empty. events_core is a materialized view of the same rows but with input/output
  // truncated (5.8 MB against 269 MB), so a scan that ran against it would silently miss most
  // of the text. events_full is the only table with the whole prompt and completion in it.
  //
  // is_deleted=0 because the table is a ReplacingMergeTree with soft deletes. No FINAL: nothing
  // in this data has a second version, and FINAL would force a merge-on-read over every part.
  // LANGFUSE_URL, LF_TABLE and the trace-link helper are shared from app.js.
  const TABLE = LF_TABLE;

  // input and output are separate columns, so the scannable text is their concatenation. Both are
  // non-nullable Strings here, so no coalesce is needed, and the newline keeps a value at the end
  // of a prompt from fusing with one at the start of a completion into a match that never existed.
  const TEXT = "concat(input, '\\n', output)";

  // trace_id, not session_id: a trace is one request/response, which is the unit worth counting,
  // and session_id is only populated on 817 of 43k rows so counting it would read as near-zero.
  const src = () => ({
    table: TABLE,
    text: TEXT,
    group: "trace_id",
    ts: "start_time",
    where: whereClause(),
    detail: `trace_id AS tid, name, type, service_name AS svc,
             provided_model_name AS model,`,
  });

  function whereClause() {
    const parts = ["is_deleted = 0"];
    for (const [id, col] of [["f-svc", "service_name"], ["f-env", "environment"], ["f-type", "type"]]) {
      const v = $(id).value;
      if (v !== "all") parts.push(`${col} = '${chEsc(v)}'`);
    }
    return parts.join(" AND ");
  }

  let DB = null;      // the whole pattern file
  let ACTIVE = [];    // patterns matching the current filters, in query order
  let PATS = [];      // per-pattern match counts
  let VALUES = [];    // one row per distinct extracted value, pattern attached
  let MODELS = {};    // value -> models it appeared under, for the table's model column
  let picked = null;

  function selectPatterns() {
    const conf = $("f-conf").value, kind = $("f-kind").value;
    return DB.patterns.filter(p =>
      (conf === "all" || p.confidence === conf) &&
      (kind === "all" || p.kind === kind));
  }

  // Which models carried each value. Asked separately from the value scan rather than added to
  // its GROUP BY: grouping by (pattern, value, model) would split one secret into a row per
  // model and break the "distinct values" count that the whole page is built on.
  //
  // Chunked for the same reason the extraction is (see SCAN_CHUNK in app.js): every unrolled
  // extractAll re-evaluates the text expression, so unrolling all the matched patterns at once
  // costs one full pass over ~1.8 GiB of prompt text per pattern and gets the query killed.
  const modelsQuery = (pats) => `
    SELECT substring(v, 1, ${VALUE_MAX}) AS val,
           arraySort(groupUniqArray(if(provided_model_name = '', '—', provided_model_name))) AS models
    FROM (
      SELECT provided_model_name, arrayJoin(arrayConcat(${pats.map(p =>
        `extractAll(${TEXT}, '(${chEsc(p.regex)})')`).join(",")})) AS v
      FROM ${TABLE} WHERE ${whereClause()} AND multiMatchAny(${TEXT}, ${arrayLit(pats)})
    )
    WHERE v != '' GROUP BY val`;

  // A value can appear under several models across chunks, so the lists are merged rather than
  // overwritten — last chunk wins would drop every model found in an earlier batch.
  async function loadModels(pats) {
    const out = {};
    for (let at = 0; at < pats.length; at += SCAN_CHUNK) {
      const part = pats.slice(at, at + SCAN_CHUNK);
      setStatus(`attributing values to models — ${Math.min(at + part.length, pats.length)} ` +
                `of ${pats.length} pattern(s)…`);
      for (const r of await query(modelsQuery(part), {}, { cache: true, textScan: true })) {
        out[r.val] = [...new Set([...(out[r.val] || []), ...r.models])].sort();
      }
    }
    return out;
  }

  const lfLink = (tid, text) => lfTrace(tid, text);

  function paint() {
    const { kept, filtered } = triage(VALUES);
    const occurrences = kept.reduce((a, r) => a + Number(r.hits), 0);
    const secrets = kept.filter(r => r.p.kind === "secret");
    const repeated = kept.filter(r => Number(r.hits) > 1);
    const inPrompts = kept.filter(r => (MODELS[r.val] || []).some(m => m !== "—"));

    const k = $("kpis");
    k.textContent = "";
    k.append(
      tileNode({ label: "Candidate secrets", value: kept.length.toLocaleString(), hero: true,
                 foot: `${occurrences.toLocaleString()} occurrences, across ` +
                       `${PATS.length} of ${ACTIVE.length.toLocaleString()} active patterns` }),
      tileNode({ label: "Rated secret", value: secrets.length.toLocaleString(),
                 foot: `candidates from patterns rated a credential` }),
      tileNode({ label: "Sent to a model", value: inPrompts.length.toLocaleString(),
                 foot: `appeared on an event with a model name — left the machine` }),
      tileNode({ label: "Seen more than once", value: repeated.length.toLocaleString(),
                 foot: kept.length ? `busiest appears ${Number(kept[0].hits).toLocaleString()} times ` +
                       `(${kept[0].p.name})` : "" }),
      tileNode({ label: "Filtered out", value: filtered.length.toLocaleString(),
                 foot: `of ${VALUES.length.toLocaleString()} distinct values — listed below` }),
    );
    if (secrets.length) k.querySelector(".tile:nth-child(2) .value").classList.add("fail");
    // A secret that only ever sat in a tool span stayed on this machine; one on an event with a
    // model name was sent to an inference endpoint, which is the distinction worth flagging.
    if (inPrompts.length) k.querySelector(".tile:nth-child(3) .value").classList.add("fail");

    $("sub-hits").textContent = kept.length
      ? `One row per distinct value that holds credential material, most-repeated first, masked ` +
        `until you reveal it. Click a row to see every event it appeared in.` +
        (VALUES.length === VALUE_LIMIT ? ` Capped at ${VALUE_LIMIT} before filtering.` : "")
      : VALUES.length ? `Every match for this filter was a keyword or an Actions pin — nothing ` +
        `with credential material in it.` : `No matches for the current filter.`;

    const host = $("c-hits");
    host.textContent = "";
    const modelCell = (r) => {
      const m = MODELS[r.val] || [];
      const real = m.filter(x => x !== "—");
      if (!real.length) return "—";
      return real.length === 1 ? real[0] : `${real[0]} +${real.length - 1}`;
    };
    const cols = [
      { h: "value", v: valueCell },
      { h: "pattern", v: r => r.p.name },
      { h: "rated", v: r => r.p.kind, cls: r => r.p.kind === "secret" ? "fail" : "" },
      { h: "model", v: modelCell, cls: r => modelCell(r) === "—" ? "" : "fail" },
      { h: "seen", n: true, v: r => Number(r.hits).toLocaleString() },
      { h: "traces", n: true, v: r => Number(r.groups).toLocaleString() },
      { h: "len", n: true, v: r => Number(r.len).toLocaleString() },
      { h: "last seen", v: r => r.last_ts.slice(0, 16) },
    ];
    const t = tableNode(cols, kept);
    [...t.tBodies[0].rows].forEach((tr, i) => {
      tr.className = "pick";
      tr.setAttribute("aria-selected", String(kept[i].val === picked));
      tr.onclick = () => showDetail(kept[i], t, tr);
    });
    const box = el("div", "scroll");
    box.append(t);
    host.append(box);

    // Filtered rows stay reachable. A detector that quietly drops things is a detector you
    // cannot audit, and both rules are heuristics.
    if (filtered.length) {
      const d = el("details"), fb = el("div", "scroll");
      fb.append(tableNode([
        { h: "why", v: r => r.why },
        ...cols.slice(0, 2),
        { h: "seen", n: true, v: r => Number(r.hits).toLocaleString() },
        { h: "len", n: true, v: r => Number(r.len).toLocaleString() },
      ], filtered));
      d.append(el("summary", null, `${filtered.length} filtered out — keywords and Actions pins`), fb);
      host.append(d);
    }

    // The per-pattern rollup, kept for judging which rule is noisy.
    const roll = el("details"), rb = el("div", "scroll");
    rb.append(tableNode([
      { h: "pattern", v: r => r.p.name },
      { h: "rated", v: r => r.p.kind, cls: r => r.p.kind === "secret" ? "fail" : "" },
      { h: "confidence", v: r => r.p.confidence },
      { h: "candidates", n: true, v: r => kept.filter(v => v.p === r.p).length.toLocaleString() },
      { h: "filtered", n: true, v: r => filtered.filter(v => v.p === r.p).length.toLocaleString() },
      { h: "events", n: true, v: r => Number(r.hits).toLocaleString() },
      { h: "last seen", v: r => r.last_ts.slice(0, 16) },
    ], PATS));
    roll.append(el("summary", null, `${PATS.length} patterns that matched`), rb);
    host.append(roll);
  }

  async function showDetail(r, table, tr) {
    picked = r.val;
    if (table) {
      for (const row of table.tBodies[0].rows) row.setAttribute("aria-selected", String(row === tr));
    }
    const host = $("c-detail");
    host.textContent = "";
    const models = (MODELS[r.val] || []).filter(m => m !== "—");
    $("sub-detail").textContent =
      `${r.p.name} — rated ${r.p.kind}, ${r.p.confidence} confidence. ` +
      `${Number(r.hits).toLocaleString()} occurrence(s) in ${Number(r.groups).toLocaleString()} trace(s).` +
      (models.length ? ` Sent under ${models.join(", ")}.` : "");
    host.append(el("p", "muted", "loading…"));
    try {
      // Cached per value: ClickHouse keys a parameterized query on its params, so clicking back
      // to a row already looked at is instant rather than another pass over the text.
      const rows = await query(placedQuery(src()), { val: r.val },
                              { cache: true, textScan: true });
      host.textContent = "";
      const head = el("p", "muted");
      head.append(document.createTextNode("Value "), valueCell(r),
                  document.createTextNode(` · regex ${r.p.regex}`));
      host.append(head);
      const box = el("div", "scroll");
      box.append(tableNode([
        { h: "when", v: r => r.ts.slice(0, 19) },
        { h: "event", v: r => `${r.name || "—"} (${r.type.toLowerCase()})` },
        { h: "from", v: r => r.svc || "—" },
        { h: "model", v: r => r.model || "—", cls: r => r.model ? "fail" : "" },
        { h: "trace", v: r => r.tid ? lfLink(r.tid, r.tid.slice(0, 8)) : "—" },
        { h: "surrounding text", v: r => revealNode(r.context, `•••• ${r.context.length} chars`) },
      ], rows));
      host.append(box);
      if (!rows.length) host.append(el("p", "muted", "No event contains this value any more."));
    } catch (e) {
      host.textContent = "";
      host.append(el("p", "err", e.message));
    }
  }

  // Filter options come from the data rather than a hardcoded list, so a new exporter shows up
  // on its own instead of being invisible until someone edits this file.
  async function fillFilters() {
    const rows = await query(`
      SELECT 'svc' AS f, service_name AS v FROM ${TABLE} WHERE is_deleted = 0 AND service_name != '' GROUP BY v
      UNION ALL
      SELECT 'env', environment FROM ${TABLE} WHERE is_deleted = 0 GROUP BY environment
      UNION ALL
      SELECT 'type', type FROM ${TABLE} WHERE is_deleted = 0 GROUP BY type`);
    for (const f of ["svc", "env", "type"]) {
      const sel = $("f-" + f), was = sel.value;
      sel.textContent = "";
      sel.append(el("option", null, "all"));
      sel.firstChild.value = "all";
      for (const r of rows.filter(r => r.f === f).map(r => r.v).sort()) {
        const o = el("option", null, f === "type" ? r.toLowerCase() : r);
        o.value = r;
        sel.append(o);
      }
      sel.value = [...sel.options].some(o => o.value === was) ? was : "all";
    }
  }

  async function load() {
    setStatus("loading patterns…");
    try {
      if (!DB) {
        const res = await fetch("secret-patterns.json");
        if (!res.ok) throw new Error(`secret-patterns.json: HTTP ${res.status} — run update-secret-patterns.py`);
        DB = await res.json();
        await fillFilters();
      }
      ACTIVE = selectPatterns();
      if (!ACTIVE.length) {
        setStatus("no patterns match that filter", true);
        return;
      }
      ({ values: VALUES, patterns: PATS } = await runScan(src(), ACTIVE, setStatus));
      // Only the patterns that matched get unrolled for the model lookup, same as extraction.
      const matched = [...new Set(VALUES.map(r => r.p))];
      MODELS = matched.length ? await loadModels(matched) : {};
      picked = null;
      clearDetail("Pick a value above to see every event it turned up in.");
      paint();
      $("notes").textContent = "";
      $("notes").append(notesNode(scanNotes(DB, {
        groupWord: "trace",
        extra: [
          `The source is Langfuse's own ClickHouse tables, same server as the acp data, different ` +
          `database. Langfuse 4 writes spans to events_full; the traces and observations tables ` +
          `still exist but are empty. events_core holds the same rows with input and output ` +
          `truncated, so the scan reads events_full — the truncated copy would miss most of the text.`,
          `Scanning input and output concatenated means this covers what was sent to a model and ` +
          `what came back: system prompts, pasted context, tool results fed to the model, and the ` +
          `model's own completions. A secret in a completion is usually one the model was shown first.`,
          `"Sent to a model" counts candidates on an event carrying a model name. That is the ` +
          `difference that matters here: a credential in the acp wire log stayed on this machine, ` +
          `while one on a generation event was sent to an inference endpoint. For Bedrock models ` +
          `that means it left the machine, and an ollama model on this box means it did not.`,
          `Counted by trace, not session: session_id is populated on a small minority of these ` +
          `events, so a per-session count would read as near-zero and mean nothing. A trace is one ` +
          `request and its spans.`,
          `The unmasked text is still in ClickHouse, in Langfuse's own UI, and in minio's event ` +
          `blobs. This page is triage, not containment: if something here is live, rotate it.`,
        ],
      })));
      setStatus(`${VALUES.length.toLocaleString()} distinct value(s) from ${PATS.length} pattern(s)`);
    } catch (e) {
      setStatus(e.message, true);
    }
  }

  mountHeader({
    current: "secrets.html",
    extraHTML: `
      <label>rated
        <select id="f-kind">
          <option value="secret" selected>secret</option>
          <option value="identifier">identifier</option>
          <option value="all">all</option>
        </select>
      </label>
      <label>confidence
        <select id="f-conf">
          <option value="high" selected>high</option>
          <option value="low">low</option>
          <option value="all">all</option>
        </select>
      </label>
      <label>from <select id="f-svc"><option value="all">all</option></select></label>
      <label>env <select id="f-env"><option value="all">all</option></select></label>
      <label>type <select id="f-type"><option value="all">all</option></select></label>`,
    onReload: load,
  });
  for (const id of ["f-kind", "f-conf", "f-svc", "f-env", "f-type"]) $(id).onchange = load;
  load();
</script>
