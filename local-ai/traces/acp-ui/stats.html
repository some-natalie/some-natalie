<!doctype html>
<meta charset="utf-8">
<title>acp · stats</title>
<link rel="stylesheet" href="app.css">
<style>
  /* Dashboard kit (cards, tiles, donut, line, heatmap, tables, tooltip) lives in app.css. */
  main { padding: 16px; display: grid; gap: 16px }
</style>

<header></header>
<main>
  <section class="card"><div class="kpis" id="kpis"></div></section>
  <section class="card">
    <h2>Tool calls per day</h2>
    <p class="sub" id="sub-days"></p>
    <div id="c-days"></div>
  </section>
  <section class="card">
    <h2>Tool calls by session</h2>
    <p class="sub" id="sub-sessions"></p>
    <div id="c-sessions"></div>
  </section>
  <section class="card">
    <h2>Tool calls by tool</h2>
    <p class="sub" id="sub-tools"></p>
    <div id="c-tools"></div>
  </section>
</main>
<footer id="notes"></footer>

<script src="app.js"></script>
<script>
  // One tool call = one toolCallId. Resuming a session via session/load re-emits its
  // whole history, so raw tool_call rows overcount; min(ts) keeps the first sighting.
  // Status only moves forward in the protocol, so rank by precedence rather than by
  // timestamp — a replayed "pending" arrives *after* the real "completed".
  const CALLS = `
    WITH calls AS (
      SELECT JSONExtractString(raw,'params','update','toolCallId') AS id,
             max(JSONExtractString(raw,'params','update','_meta','claudeCode','toolName')) AS tool,
             max(JSONExtractString(raw,'params','update','kind')) AS kind,
             max(session_id) AS sid,
             min(ts) AS first_ts,
             max(indexOf(['pending','in_progress','completed','failed'],
                 JSONExtractString(raw,'params','update','status'))) AS rank
      FROM acp.messages
      WHERE JSONExtractString(raw,'params','update','sessionUpdate') IN ('tool_call','tool_call_update')
      GROUP BY id HAVING id != ''
    )`;

  const DAYS = 365;  // rolling window, the point past which the daily marks stop being readable

  const Q = {
    totals: `${CALLS}
      SELECT count() AS calls, uniqExact(sid) AS sessions, countIf(rank = 4) AS failed,
             countIf(rank < 3) AS unfinished, min(first_ts) AS from_ts, max(first_ts) AS to_ts,
             uniqExact(toDate(first_ts)) AS days
      FROM calls`,
    byTool: `${CALLS}
      SELECT name, any(kind) AS kind, count() AS calls, countIf(rank = 4) AS failed
      FROM (SELECT if(tool != '', tool, concat('(', kind, ')')) AS name, kind, rank FROM calls)
      GROUP BY name ORDER BY calls DESC`,
    // Filled from the first day that has data, not from the window's start, so a short history
    // doesn't render as a year of empty days. assumeNotNull: FILL FROM rejects a Nullable bound.
    byDay: `${CALLS}
      SELECT toDate(first_ts) AS day, count() AS calls, countIf(rank = 4) AS failed
      FROM calls WHERE first_ts >= today() - ${DAYS - 1}
      GROUP BY day ORDER BY day
      WITH FILL FROM assumeNotNull((SELECT greatest(toDate(min(first_ts)), today() - ${DAYS - 1})
                                    FROM calls)) TO today() + 1 STEP 1`,
    bySession: `${CALLS}
      SELECT c.sid AS sid, count() AS calls, countIf(c.rank = 4) AS failed,
             min(c.first_ts) AS started, any(z.title) AS title
      FROM calls AS c
      LEFT JOIN (SELECT session_id, argMax(title, ts) AS title FROM acp.zed_titles GROUP BY session_id) AS z
        ON z.session_id = c.sid
      GROUP BY sid ORDER BY calls DESC`,
    cost: `SELECT sum(c) AS cost FROM (
             SELECT session_id, max(JSONExtractFloat(raw,'params','update','cost','amount')) AS c
             FROM acp.messages
             WHERE JSONExtractString(raw,'params','update','sessionUpdate') = 'usage_update'
             GROUP BY session_id)`,
  };

  let DATA = null;

  function paint() {
    const { totals, byTool, byDay, bySession, cost } = DATA;
    const t = totals[0];
    const total = Number(t.calls);
    const failed = Number(t.failed);
    const rate = total ? (failed / total * 100) : 0;

    // KPIs
    const k = $("kpis");
    k.textContent = "";
    k.append(
      tileNode({ label: "Tool calls", value: total.toLocaleString(), hero: true,
                 foot: `${t.from_ts.slice(0, 10)} → ${t.to_ts.slice(0, 10)}` }),
      tileNode({ label: "Sessions with tool calls", value: Number(t.sessions).toLocaleString(),
                 foot: `${(total / Math.max(Number(t.sessions), 1)).toFixed(0)} calls per session` }),
      tileNode({ label: "Distinct tools", value: byTool.length,
                 foot: byTool[0] ? `${byTool[0].name} leads at ${(byTool[0].calls / total * 100).toFixed(0)}%` : "" }),
      tileNode({ label: "Failed", value: failed ? `✕ ${failed}` : "0",
                 foot: `${rate.toFixed(1)}% of calls` }),
      tileNode({ label: "Agent spend", value: cost[0] && Number(cost[0].cost) ? money(cost[0].cost) : "—",
                 foot: "sum of per-session totals" }),
    );
    if (failed) k.querySelector(".tile:nth-child(4) .value").classList.add("fail");

    // Tools. Six segments is the ceiling for a ring, so the top five get one each and the tail
    // becomes one slice. Colour is identity here, which means it cannot also carry failure — the
    // failed column and the tooltip do that.
    // Cut by share as well as rank: with one tool at 68% the fifth-place arc was 0.6%, thinner
    // than the "other" slice beside it and too thin to read. byTool is sorted, so filtering the
    // top five by share is the same as stopping at the first one too small to draw.
    const SLICES = 5, MIN_SHARE = 0.015;
    const head = byTool.slice(0, SLICES).filter(r => Number(r.calls) / total >= MIN_SHARE);
    const tail = byTool.slice(head.length);
    const slices = tail.length
      ? [...head, {
          name: `other (${tail.length} tools)`, kind: "mixed",
          calls: tail.reduce((a, r) => a + Number(r.calls), 0),
          failed: tail.reduce((a, r) => a + Number(r.failed), 0),
        }]
      : head;
    const toolTip = r => `${r.name}\nkind: ${r.kind}\n${Number(r.calls).toLocaleString()} calls · ` +
                         `${(r.calls / total * 100).toFixed(1)}%` +
                         (Number(r.failed) ? `\n✕ ${r.failed} failed` : "");

    $("sub-tools").textContent =
      `${byTool.length} distinct tools over ${total.toLocaleString()} calls, by share. The ring is ` +
      `the ${head.length} above ${(MIN_SHARE * 100).toFixed(1)}%; every tool is in the table. Tool ` +
      `name comes from the agent's _meta.claudeCode.toolName, and a bare (kind) is an agent that ` +
      `doesn't report one.`;
    const thost = $("c-tools");
    thost.textContent = "";
    const tsplit = el("div", "split");
    tsplit.append(
      donut(slices, {
        label: r => r.name, value: r => Number(r.calls), tipText: toolTip,
        centre: compact(total), centreFoot: "tool calls",
      }),
      (() => {
        const box = el("div", "scroll");
        const rank = new Map(head.map((r, i) => [r.name, i]));
        box.append(tableNode([
          { h: "", v: r => {
              const sw = el("i", "sw");
              // head.length, not SLICES: the share threshold can shorten the head, and the ring
              // gives "other" the slot right after it.
              sw.style.background = CAT[rank.has(r.name) ? rank.get(r.name) : head.length];
              return sw;
            } },
          { h: "tool", v: r => r.name }, { h: "kind", v: r => r.kind },
          { h: "calls", n: true, v: r => Number(r.calls).toLocaleString() },
          { h: "share", n: true, v: r => (r.calls / total * 100).toFixed(1) + "%" },
          { h: "failed", n: true, v: r => Number(r.failed) || "", cls: r => Number(r.failed) ? "fail" : "" },
        ], byTool));
        return box;
      })(),
    );
    thost.append(tsplit);

    // Days. Both series share one scale, so the failure line reads as the small share it is
    // rather than being inflated onto an axis of its own.
    $("sub-days").textContent =
      `${byDay.length} days (rolling ${DAYS}-day window). First observation of each call, so ` +
      `replays don't double-count. Hover for a day's counts.`;
    render("c-days",
      host => lineChart(host, byDay, {
        x: r => r.day,
        series: [
          { name: "tool calls", value: r => Number(r.calls), color: "var(--viz-series)", area: true },
          { name: "failed", value: r => Number(r.failed), color: "var(--viz-crit)" },
        ],
        tipText: r => `${r.day}\n${Number(r.calls).toLocaleString()} calls\n` +
                      `✕ ${Number(r.failed).toLocaleString()} failed`,
      }),
      () => tableNode([
        { h: "day", v: r => r.day },
        { h: "calls", n: true, v: r => Number(r.calls).toLocaleString() },
        { h: "failed", n: true, v: r => Number(r.failed) || "", cls: r => Number(r.failed) ? "fail" : "" },
      ], byDay));

    // Sessions. One bar per session was hundreds of rows nobody reads: what the numbers are
    // actually asked is how lopsided the distribution is, which takes five figures and a
    // drill-in for the cases worth naming. bySession arrives sorted by calls, descending.
    const label = r => (r.title || r.sid).slice(0, 40) || "(untitled)";
    const percalls = bySession.map(r => Number(r.calls));
    const asc = [...percalls].sort((a, b) => a - b);
    const pctile = p => asc[Math.min(asc.length - 1, Math.floor(p * asc.length))];
    let acc = 0, heads = 0;
    while (acc < total / 2 && heads < percalls.length) acc += percalls[heads++];
    const withFail = bySession.filter(r => Number(r.failed)).length;

    $("sub-sessions").textContent =
      `${bySession.length} sessions made at least one tool call. Titled from Zed's own session ` +
      `titles where available.`;
    const host = $("c-sessions");
    host.textContent = "";
    const stats = el("div", "kpis");
    stats.append(
      tileNode({ label: "Median session", value: pctile(0.5).toLocaleString(), foot: "tool calls" }),
      tileNode({ label: "90th percentile", value: pctile(0.9).toLocaleString(),
                 foot: "one session in ten is at least this busy" }),
      tileNode({ label: "Busiest session", value: compact(percalls[0]), foot: label(bySession[0]) }),
      tileNode({ label: "Half the calls", value: heads,
                 foot: `sessions account for half of all ${compact(total)}` }),
      tileNode({ label: "Sessions with a failure", value: `${(withFail / bySession.length * 100).toFixed(0)}%`,
                 foot: `${withFail} of ${bySession.length}` }),
    );
    const drill = el("details");
    const scroll = el("div", "scroll");
    scroll.append(tableNode([
      { h: "session", v: label }, { h: "started", v: r => r.started.slice(0, 16) },
      { h: "calls", n: true, v: r => Number(r.calls).toLocaleString() },
      { h: "failed", n: true, v: r => Number(r.failed) || "", cls: r => Number(r.failed) ? "fail" : "" },
    ], bySession));
    drill.append(el("summary", null, `every session, busiest first`), scroll);
    host.append(stats, drill);

    const notes = $("notes");
    notes.textContent = "";
    notes.append(notesNode([
      `Counts are distinct toolCallIds, first sighting only — session replays re-emit history and would otherwise inflate totals.`,
      `Outcome is the highest status a call reached, not its latest: a replayed "pending" lands after the real "completed".`,
      Number(t.unfinished) ? `${t.unfinished} call(s) currently unfinished (pending or in progress).` : "",
      `The tap logs the session you are reading this from, so live sessions inflate their own numbers.`,
    ]));
  }

  async function load() {
    setStatus("loading…");
    try {
      const [totals, byTool, byDay, bySession, cost] = await Promise.all(
        [Q.totals, Q.byTool, Q.byDay, Q.bySession, Q.cost].map(s => query(s)));
      if (!totals.length || !Number(totals[0].calls)) {
        setStatus("no tool calls recorded yet");
        $("kpis").textContent = "";
        return;
      }
      DATA = { totals, byTool, byDay, bySession, cost };
      paint();
      setStatus(`${Number(totals[0].calls).toLocaleString()} tool calls`);
    } catch (e) {
      setStatus(e.message, true);
    }
  }

  mountHeader({
    current: "stats.html",
    onReload: load,
    onToggleView: () => { if (DATA) paint() },
  });
  load();
</script>
